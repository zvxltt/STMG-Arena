DX("Doc 3 · Objectifs affichés","<p>« Rendre les Français fiers. » — « Faire progresser les jeunes joueurs. » — « Atteindre au minimum la demi-finale du tournoi, le 14 juillet. »</p>")],
p:[C("Doc 1. Associe chaque journée à une fonction de Fayol.",["Prévoir","Organiser","Commander","Coordonner","Contrôler"],[["Lundi : fixer le calendrier",0],["Mardi : répartir les rôles du staff",1],["Vendredi : annoncer et imposer ses choix",2],["Faire travailler ensemble médecins et préparateurs (doc 2)",3],["Analyser les performances après chaque amical",4]]),
C("Doc 2. Quel mode de coordination ?",["Supervision directe","Standardisation","Ajustement mutuel"],[["Règlement intérieur écrit",1],["Les joueurs s'adaptent sur le terrain",2],["Protocole des déplacements",1],["Le sélectionneur donne une consigne à un joueur",0]]),
Q("Doc 1. Le mercredi, le sélectionneur adopte un style plutôt…",["Directif","Participatif","Délégatif","Autoritaire"],1),
C("Doc 3. Classe chaque phrase.",["Finalité / but","Objectif SMART"],[["Rendre les Français fiers",0],["Faire progresser les jeunes joueurs",0],["Atteindre au minimum la demi-finale le 14 juillet",1]]),
R("Doc 1 (jeudi). Explique, avec la notion de rationalité limitée, pourquoi la liste ne sera jamais « parfaite ».",[["Rationalité limitée / Simon","rationalite limitee|simon"],["Information incomplète","information|tous les voir|incomplet"],["Temps limité (48 h)","48|temps"],["Solution satisfaisante, pas optimale","satisfaisante|pas optimale|pas la meilleure|optimal"]])],
cor:"1) Prévoir (lundi), organiser (mardi), commander (vendredi), coordonner (médecins/préparateurs), contrôler (analyse après les matchs).\n2) Règlement et protocole = standardisation ; adaptation entre joueurs = ajustement mutuel ; consigne directe = supervision directe.\n3) Participatif : il associe les cadres.\n4) Fierté et progression = finalité/buts ; demi-finale datée = objectif SMART.\n5) Selon Simon, le décideur a une rationalité limitée : information incomplète (il ne peut pas voir jouer les 60 joueurs), temps limité (48 h), biais personnels. Il choisit une solution satisfaisante, pas optimale."};

<script>

{ const o=loadState(); if(o) S=Object.assign(S,o); }

  async get(){ const db=IDB.db||await IDB.open(); if(!db) return null; return new Promise(res=>{ try{ const q=db.transaction('kv').objectStore('kv').get('state'); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }catch(e){ res(null); } }); },

const pctIn=x=>{const {r,next}=rankFor(x); return next? (x-r.x)/(next.x-r.x)*100 : 100;};

let gid=0;
function emblem(i){ const r=RANKS[Math.max(0,Math.min(RANKS.length-1,i))], c=r.c, id='g'+(gid++);

  let s='';

  document.body.appendChild(el);

const SER=['var(--cyan)','var(--pink)','var(--yel)','var(--lime)'];
function chartSVG(g){

  if(g.k==='bar'){ const bw=Math.min(46,(cw-16)/g.s.length);
    g.s.forEach((s,si)=>s[1].forEach((v,i)=>{ const x=L+cw*i+cw/2-(bw*g.s.length)/2+si*bw; o+=`<rect x="${x+2}" y="${y(Math.max(v,0))}" width="${bw-4}" height="${Math.abs(y(v)-y(0))}" rx="3" style="fill:${SER[si]}"/><text x="${x+bw/2}" y="${y(Math.max(v,0))-5}" text-anchor="middle" font-size="11" style="fill:var(--fg)">${fmt(v)}</text>`; })); }

  o+='</svg>';
  return `<div class="chart">${g.ti?`<p class="ct">${esc(g.ti)}</p>`:''}${o}<div class="legend">${g.s.map((s,i)=>`<span><i style="background:${SER[i]}"></i>${esc(s[0])}</span>`).join('')}</div></div>`;
}
function wrapLab(s,max){ if(s.length<=max) return [s]; const w=s.split(' '); let a='',b=''; w.forEach(x=>{ if((a+' '+x).trim().length<=max && !b) a=(a+' '+x).trim(); else b=(b+' '+x).trim(); }); return b?[a,b]:[a]; }

/* ---------- correction automatique ---------- */
function collect(m){
  return m.p.map((part,pi)=>{ const id=m.id+'-'+pi;
    if(part.ty==='graph') return null;
    if(part.ty==='qcm') return {sel:[...document.querySelectorAll(`input[name="${id}"]:checked`)].map(x=>+x.value)};
    if(part.ty==='redac') return {t:(document.getElementById(id+'-t')||{}).value||''};
    const n= part.ty==='calc'?part.f.length : part.ty==='cls'?part.it.length : part.ty==='tab'? part.r.flat().filter(c=>c&&typeof c==='object').length : (part.s.match(/\[\[/g)||[]).length;
    const o={}; for(let i=0;i<n;i++){ const el=document.getElementById(id+'-'+i); o[i]=el?el.value:''; } return o; });
}
function okNum(x,v,tol,label){ const n=parseNum(x); if(isNaN(n)) return false; const t= tol!=null? tol : Math.max(Math.abs(v)*0.005,0.01); if(label&&/%/.test(label)&&Math.abs(v)>=1&&Math.abs(n*100-v)<=t+1e-9) return true; if(label&&/propension|elasticit|élasticit/i.test(label)&&Math.abs(v)<1&&Math.abs(n/100-v)<=t+1e-9) return true; return Math.abs(n-v)<=t+1e-9; }
function grade(m,ans){
  let got=0, tot=0; const marks=m.p.map((part,pi)=>{ const a=ans[pi]||{};
    if(part.ty==='graph') return null;
    if(part.ty==='calc'){ const r=part.f.map((f,i)=>okNum(a[i],f[1],f[2],f[0])); tot+=r.length; got+=r.filter(Boolean).length; return r; }
    if(part.ty==='qcm'){ const s=(a.sel||[]).slice().sort().join(','), ok= s===part.a.slice().sort().join(','); tot+=1; got+=ok?1:0; return ok; }
    if(part.ty==='cls'){ const r=part.it.map((it,i)=>String(a[i])===String(it[1])); tot+=r.length; got+=r.filter(Boolean).length; return r; }
    if(part.ty==='tab'){ const cells=part.r.flat().filter(c=>c&&typeof c==='object'); const r=cells.map((c,i)=> 'v' in c ? okNum(a[i],c.v,c.tol) : String(a[i])===String(c.a)); tot+=r.length; got+=r.filter(Boolean).length; return r; }
    if(part.ty==='trou'){ const alts=[...part.s.matchAll(/\[\[(.*?)\]\]/g)].map(x=>x[1].split('|').map(s=>norm(s).replace(/[.;,]+$/,''))); const r=alts.map((al,i)=>al.includes(norm(a[i]).replace(/[.;,]+$/,''))); tot+=r.length; got+=r.filter(Boolean).length; return r; }
    if(part.ty==='redac'){ const txt=norm(a.t), long=txt.length>=40; const r=part.k.map(c=> long && c.slice(1).every(alt=>new RegExp(alt).test(txt))); const max=part.max||r.length; tot+=max; got+=Math.min(max,r.filter(Boolean).length); return r; }
  });
  return {marks, score: tot? Math.round(got/tot*100)/10 : 0, ratio: tot?got/tot:0};
}
function countMissing(m,ans){ let n=0; m.p.forEach((part,pi)=>{ const a=ans[pi]; if(!a) return; if(part.ty==='qcm'){ if(!a.sel.length) n++; } else if(part.ty==='redac'){ if(a.t.trim().length<20) n++; } else Object.values(a).forEach(v=>{ if(String(v).trim()==='') n++; }); }); return n; }
function validate(id,force){
  const m=FIND(id), ans=collect(m);
  const empty=ans.every((a,i)=>{ if(!a) return true; if(a.sel) return !a.sel.length; if('t' in a) return !a.t.trim(); return Object.values(a).every(v=>String(v).trim()===''); });
  if(empty){ toast('Réponds au moins à une question avant de valider.'); return; }
  const miss=countMissing(m,ans);
  if(miss>0 && !force){ const box=document.querySelector('#m-'+id+' .row'); let w=document.getElementById('warn-'+id); if(!w){ w=document.createElement('div'); w.id='warn-'+id; w.className='warn'; box.before(w); } w.innerHTML=`<b>${miss} réponse${miss>1?'s':''} manquante${miss>1?'s':''}.</b> L'XP n'est gagnée qu'au premier essai : vérifie avant de valider.<div class="row"><button class="btn" data-force="${id}">Valider quand même</button><button class="btn ghost" data-dismiss="${id}">Je complète</button></div>`; w.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  stopChrono(id);
  const g=grade(m,ans), prev=S.done[id], first=!prev;
  const gain= first? Math.round(m.xp*g.ratio) : 0;
  S.done[id]={best: prev? Math.max(prev.best,g.score):g.score, last:g.score, ans, marks:g.marks, at:Date.now(), tries:(prev?prev.tries:0)+1, gain, firstScore: prev?prev.firstScore:g.score};
  if(S.draft) delete S.draft[id];
  touchDay(); save();
  const el=document.getElementById('m-'+id); el.outerHTML=missionHTML(m,'review'); revealScore(id);
  document.getElementById('m-'+id).scrollIntoView({behavior:'smooth',block:'start'});
  if(gain>0) gainXP(gain, m.pc?'Pré-contrôle : '+fmt(g.score*2)+'/20':(g.score>=8?'Mission réussie':g.score>=5?'Mission validée':'Bonnes réponses'));
  const l=lessonOf(m.lesson); if(lessonState(l).cleared && !S.clear[l.id]){ S.clear[l.id]=1; save(); gainXP(LESSON_CLEAR_XP,'Leçon validée'); }
  hud();
}

function revealScore(id){ const box=document.querySelector('#m-'+id+' .verdict'); if(!box) return; box.classList.add('reveal'); const s=box.querySelector('.score'); if(!s||reduceMotion()) return; const txt=s.firstChild, target=parseFloat(String(txt.textContent).replace(',','.'))||0; const t0=performance.now(); const st=now=>{ const p=Math.min(1,(now-t0)/800), e=1-Math.pow(1-p,3); txt.textContent=fmt(Math.round(target*e*10)/10); if(p<1) requestAnimationFrame(st); else txt.textContent=fmt(target); }; requestAnimationFrame(st); }

/* ---------- scanner : OCR local (Tesseract) + mots-clés ---------- */
let tessP=null;
function loadTess(){ if(window.Tesseract) return Promise.resolve(); if(tessP) return tessP; tessP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.onload=res; s.onerror=()=>{tessP=null; rej(new Error('load'));}; document.head.appendChild(s); }); return tessP; }
async function ocr(file){
  const st=$('#ocrstate'); st.innerHTML='<p class="note" id="ocrmsg">Chargement du lecteur de texte…</p><div class="pbar"><b id="ocrbar"></b></div>';
  await loadTess();
  const worker=await Tesseract.createWorker('fra',1,{workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/fra@1.0.0/4.0.0_best_int',
    logger:m=>{ const b=$('#ocrbar'), t=$('#ocrmsg'); if(b&&m.progress!=null) b.style.width=Math.round(m.progress*100)+'%'; if(t) t.textContent= m.status==='recognizing text'?'Lecture du texte…':'Préparation…'; }});
  const {data}=await worker.recognize(file); await worker.terminate();
  st.innerHTML=''; return data.text||'';
}
function bindScan(){
  const drop=$('#drop'), file=$('#file'), go=$('#scango'), txt=$('#scantext');
  const upd=()=>{ go.disabled = txt.value.trim().length<15; };
  txt.addEventListener('input',upd);
  const take=async f=>{ if(!f) return; if(!/^image\//.test(f.type)){ toast('Choisis une image'); return; }
    const u=URL.createObjectURL(f); $('#dropin').innerHTML='<img class="prev" src="'+u+'" alt="Aperçu de ton cours"><label class="btn ghost" for="file">Changer d\'image</label>';
    const line=document.createElement('div'); line.className='scanline'; drop.appendChild(line);
    try{ const t=await ocr(f); txt.value=t.trim(); upd(); if(t.trim().length>=15) runMatch(); else $('#scanres').innerHTML='<p class="note" style="color:var(--mid)">Je n\'ai pas réussi à lire assez de texte. Essaie une photo plus nette et bien éclairée, ou colle un extrait.</p>'; }
    catch(e){ $('#ocrstate').innerHTML='<p class="note" style="color:var(--mid)">La lecture de la photo n\'a pas pu démarrer sur cet appareil. Colle plutôt un extrait de ton cours ci-dessus.</p>'; }
    finally{ line.remove(); } };
  file.addEventListener('change',()=>take(file.files[0]));
  ['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop',e=>take(e.dataTransfer.files[0]));
  go.addEventListener('click',runMatch);
}
const STOP=new Set('dans pour avec cette comme entre leurs sont elle elles ils plus moins tout tous toute toutes faire etre avoir chaque autre autres selon aussi mais donc alors leur quand sans sous vers'.split(' '));
const LEX=LESSONS.map(l=>{ const terms=new Set(); norm(l.kw+' '+l.titre).split(/[^a-z0-9]+/).forEach(w=>{ if(w.length>4&&!STOP.has(w)) terms.add(w); }); return {l,terms:[...terms]}; });
function runMatch(){
  const t=norm($('#scantext').value); if(t.length<15) return;
  const words=new Set(t.split(/[^a-z0-9]+/));
  const df={}; LEX.forEach(x=>x.terms.forEach(w=>df[w]=(df[w]||0)+1));
  const sc=LEX.map(x=>{ let s=0; x.terms.forEach(w=>{ if(words.has(w)||t.includes(w)) s+=1/df[w]; }); return {l:x.l,s}; }).sort((a,b)=>b.s-a.s);
  const res=$('#scanres');
  if(!sc[0].s){ res.innerHTML='<p class="note" style="color:var(--mid)">Aucune leçon reconnue. Ajoute plus de texte (titre, définitions, mots-clés).</p>'; return; }
  const top=sc[0], conf=Math.round(100*top.s/(top.s+(sc[1].s||0)+0.0001)), l=top.l, p=partOf(l.part);
  const found=LEX.find(x=>x.l===l).terms.filter(w=>words.has(w)).slice(0,8);
  res.innerHTML=`<div class="match" style="--pc:${p.col}"><div class="eyebrow" style="color:${p.col}">Cible verrouillée · ${esc(p.court)}</div><b class="t">${esc(l.titre)}</b><span class="note">Correspondance ${conf} % · mots repérés : ${esc(found.join(', ')||'—')}</span><div class="row"><a class="btn" href="#lecon-${l.id}">Aller à la leçon</a></div></div>${sc[1].s?`<p class="note">Proche aussi : ${sc.slice(1,3).filter(x=>x.s).map(x=>`<a href="#lecon-${x.l.id}">${esc(x.l.titre)}</a>`).join(' · ')}</p>`:''}`;
}

/* ---------- routeur ---------- */
function route(){
  const h=(location.hash||'#home').slice(1); if(S.at!==h||S.tab!==lessonTab){ S.at=h; S.tab=lessonTab; save(); } let html, after=null;
  if(h.startsWith('map-')) html=vMap(h.slice(4));
  else if(h.startsWith('lecon-')) html=vLesson(h.slice(6));
  else if(h.startsWith('revoir-')) html=vReview(h.slice(7));
  else if(h==='arene') html=vArena();
  else if(h==='rangs') html=vRanks();
  else if(h==='scan') html=vScan();
  else html=vHome();
  const v=$('#view'); v.innerHTML=html; if(!reduceMotion()){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); } hud(); if(h==='scan') bindScan(); if(h==='rangs') bindSave(); { const sc=document.getElementById('scroller'); if(sc) sc.scrollTop=0; else window.scrollTo(0,0); }
}
window.addEventListener('hashchange',()=>{ if(location.hash.startsWith('#lecon-')) lessonTab='cours'; route(); });
document.addEventListener('input',e=>{ const m=e.target.closest&&e.target.closest('.mission'); if(!m||e.target.disabled) return; const id=m.id.slice(2), mm=FIND(id); if(!mm) return; S.draft=S.draft||{}; S.draft[id]=collect(mm); save(); });
document.addEventListener('change',e=>{ if(e.target.matches('.mission input[type=radio],.mission input[type=checkbox],.mission select')) e.target.dispatchEvent(new Event('input',{bubbles:true})); });
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.tab){ lessonTab=b.dataset.tab; S.tab=lessonTab; save(); const id=(location.hash.match(/lecon-(\w+)/)||[])[1]||S.last; const v=$('#view'), y=document.getElementById('scroller').scrollTop; v.innerHTML=vLesson(id); document.getElementById('scroller').scrollTop=Math.min(y,v.querySelector('.segs').offsetTop-8); const lt=document.getElementById('ltab'); if(lt&&!reduceMotion()) lt.classList.add('tabin'); hud(); return; }
  if(b.dataset.validate){ return validate(b.dataset.validate); }
  if(b.dataset.force){ stopChrono(b.dataset.force); return validate(b.dataset.force,true); }
  if(b.dataset.dismiss){ const w=document.getElementById('warn-'+b.dataset.dismiss); if(w) w.remove(); return; }
  if(b.dataset.chrono){ startChrono(b.dataset.chrono,b); return; }
  if(b.dataset.review){ const m=FIND(b.dataset.review); document.getElementById('m-'+m.id).outerHTML=missionHTML(m,'review'); return; }
  if(b.dataset.retry){ const m=FIND(b.dataset.retry); if(S.draft) delete S.draft[m.id]; document.getElementById('m-'+m.id).outerHTML=missionHTML(m); document.getElementById('m-'+m.id).scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(b.dataset.af){ arenaF=b.dataset.af; $('#view').innerHTML=vArena(); return; }
});
function bindSave(){

  $('#loadsave').onclick=()=>{ const v=ta.value.trim(); if(!v||v===exportCode()){ msg.textContent='Colle d\'abord un code venant d\'un autre appareil.'; return; }
    if(!armed){ armed=true; $('#loadsave').textContent='Confirmer : remplacer ma progression'; msg.textContent='Ta progression actuelle sur cet appareil sera remplacée.'; return; }
    try{ importCode(v); toast('Progression restaurée'); route(); }catch(e){ armed=false; $('#loadsave').textContent='Restaurer cette progression'; msg.textContent='Code invalide : vérifie qu\'il est complet.'; } };
}
const chronos={};
function startChrono(id,btn){ if(chronos[id]) return; const t0=Date.now(), el=document.getElementById('clk-'+id); el.hidden=false; btn.hidden=true;
  chronos[id]=setInterval(()=>{ const e=document.getElementById('clk-'+id); if(!e){ clearInterval(chronos[id]); delete chronos[id]; return; } const s=Math.floor((Date.now()-t0)/1000); e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); },1000); }
function stopChrono(id){ if(chronos[id]){ clearInterval(chronos[id]); delete chronos[id]; } }
function bootDone(){ const sp=document.getElementById('splash'); if(!sp) return; const imgs=[...document.querySelectorAll('#view img')]; const t0=performance.now();
  Promise.race([Promise.all(imgs.map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve())), new Promise(r=>setTimeout(r,2500))]).then(()=>{ const wait=Math.max(0,700-(performance.now()-t0)); setTimeout(()=>{ sp.classList.add('out'); setTimeout(()=>sp.remove(),600); },reduceMotion()?0:wait); }); }

let deferredInstall=null; addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; const b=document.getElementById('installbtn'); if(b) b.hidden=false; });
function installHTML(){ const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone; if(standalone) return ''; let off=false; try{ off=localStorage.getItem('stmg-install-off')==='1'; }catch(e){}; if(off) return ''; const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="install" id="installbox"><div style="flex:1;min-width:200px"><b>Installe STMG Arena comme une vraie app</b><p class="note">${ios?'Dans Safari, touche le bouton Partager puis « Sur l\'écran d\'accueil ». L\'app s\'ouvrira en plein écran et ta progression sera mieux protégée.':'Ajoute-la à ton écran d\'accueil : elle s\'ouvrira en plein écran, comme une appli.'}</p></div><div class="row">${ios?'':`<button class="btn" id="installbtn" ${deferredInstall?'':'hidden'}>Installer</button>`}<button class="btn ghost" id="installoff">Plus tard</button></div></div>`; }
document.addEventListener('click',async e=>{ const t=e.target.closest('#installbtn,#installoff'); if(!t) return; if(t.id==='installbtn'&&deferredInstall){ deferredInstall.prompt(); deferredInstall=null; } try{ localStorage.setItem('stmg-install-off','1'); }catch(er){} const b=document.getElementById('installbox'); if(b) b.remove(); });
hud(); route(); bootDone();
})();

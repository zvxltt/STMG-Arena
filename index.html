<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STMG Arena">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="STMG Arena : révise la Première STMG comme dans un jeu vidéo. 16 leçons, 80 missions corrigées automatiquement, XP et rangs.">
<title>STMG Arena</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 2 37 15 20 38 3 15Z' fill='%23ff4655'/%3E%3Cpath d='M20 2 28 15 20 38 12 15Z' fill='%23ffd23f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Teko:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout : HUD collant en haut, contenu centré 1100px. Univers sombre unique façon lobby de jeu. */
:root{
  color-scheme:dark;
  --bg:#0d0b16; --bg2:#14111f; --panel:#1b1729; --panel2:#241f37; --line:#342d52;
  --fg:#f4f0ff; --mute:#a9a2c8; --dim:#736b97;
  --red:#ff4655; --yel:#ffd23f; --cyan:#34e1ff; --vio:#a77bff; --lime:#b8f34a; --pink:#ff5fae; --blue:#5b9bff;
  --c-sgn:var(--cyan); --c-mgt:var(--red); --c-droit:var(--vio); --c-eco:var(--yel);
  --t-rap:var(--pink); --t-jeu:var(--lime); --t-foot:var(--blue); --t-edf:#e9edff;
  --good:#4ade80; --mid:#ffb84a; --bad:#ff5a6a;
  --f-disp:'Bungee','Arial Black',Impact,sans-serif;
  --f-hud:'Teko','Arial Narrow','Roboto Condensed',sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;background:radial-gradient(1100px 600px at 85% -10%,#2b1640 0%,transparent 60%),radial-gradient(900px 500px at -10% 10%,#0f2a40 0%,transparent 55%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg2)}
a{color:var(--cyan)}
button,select,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg2) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hud .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--f-disp);font-size:20px;color:var(--fg);text-decoration:none;display:flex;align-items:center;gap:12px;white-space:nowrap}
.logo i{display:inline-block;width:13px;height:13px;margin-right:6px;background:var(--red);transform:rotate(45deg);box-shadow:6px -6px 0 var(--yel)}
nav.tabs{display:flex;gap:4px;flex:1;min-width:0}
nav.tabs a{font-family:var(--f-hud);font-size:21px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);text-decoration:none;padding:2px 12px;border-radius:8px;line-height:1.3;white-space:nowrap}
nav.tabs a:hover{color:var(--fg);background:var(--panel)}
nav.tabs a.on{color:var(--bg);background:var(--yel)}
nav.tabs svg{display:none;width:22px;height:22px;fill:currentColor}
html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
body,button,a,input,select,textarea,label{touch-action:manipulation}
.save{display:flex;flex-direction:column;gap:10px}
body{-webkit-tap-highlight-color:transparent}
.rankchip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;text-decoration:none;color:var(--fg)}
.gem{width:34px;height:34px;display:grid;place-items:center;flex:none}
.gem svg{width:100%;height:100%}
.rankchip .lbl{font-family:var(--f-hud);font-size:19px;line-height:1;text-transform:uppercase;letter-spacing:1px}
.rankchip .bar{width:110px;height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}
.rankchip .bar b{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--vio))}
.rankchip small{display:block;font-family:var(--f-hud);font-size:15px;color:var(--mute);line-height:1;margin-top:2px}
@media (max-width:720px){
  .hud{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg2)}
  .hud .wrap{padding-block:8px;flex-wrap:nowrap;justify-content:space-between}
  .segs{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .segs button{font-size:18px;padding:4px 4px;letter-spacing:.5px}
  .logo{font-size:17px}
  .rankchip{padding:3px 12px 3px 3px;gap:8px}
  .rankchip .gem{width:28px;height:28px}
  .rankchip .lbl{font-size:17px}
  .rankchip .bar{width:84px}
  .rankchip small{display:none}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:55;display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--bg2);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px;padding:6px 2px 4px;border-radius:10px;letter-spacing:.5px;min-height:52px;justify-content:center}
  nav.tabs a.on{background:transparent;color:var(--yel)}
  nav.tabs a.on svg{filter:drop-shadow(0 0 6px rgba(255,210,63,.6))}
  nav.tabs svg{display:block}
  main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
  footer{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  input.num,input.txt,select,textarea{font-size:16px}
  .view{gap:20px}
}

main{padding-block:22px 80px}
.view{display:flex;flex-direction:column;gap:24px}
.eyebrow{font-family:var(--f-hud);font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--yel);line-height:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .12s;color:var(--bg);background:var(--yel);box-shadow:0 4px 0 #b18d00}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b18d00}
.btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 #a5222d}
.btn.ghost{background:var(--panel2);color:var(--fg);box-shadow:0 4px 0 #07060d;border:1px solid var(--line)}
.btn.cyan{background:var(--cyan);box-shadow:0 4px 0 #0b8aa0}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.note{font-size:14px;color:var(--mute);margin:0}

.hero{position:relative;border-radius:22px;overflow:hidden;min-height:360px;display:flex;align-items:flex-end;border:1px solid var(--line)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,11,22,.94) 0%,rgba(13,11,22,.6) 45%,rgba(13,11,22,0) 72%),linear-gradient(0deg,rgba(13,11,22,.8),transparent 45%)}
.hero .in{position:relative;z-index:1;padding:28px;max-width:560px;display:flex;flex-direction:column;gap:12px}
.hero h1{font-family:var(--f-disp);font-size:clamp(30px,5.2vw,52px);line-height:1.02;text-shadow:0 4px 0 #000}
.hero h1 em{font-style:normal;color:var(--cyan)}
.hero p{margin:0;color:#ddd6ff;max-width:46ch}
@media (max-width:720px){.hero{min-height:420px}.hero .in{padding:20px}.banner{min-height:150px}.banner .in{padding:16px}.sechead h2{font-size:21px}.mission{padding:16px 14px;border-left-width:4px}.mhead h3{flex-basis:100%;order:3;font-size:18px}.mhead .xp{margin-left:auto}.part .q{font-size:15px}.drop{min-height:220px}.stat b{font-size:32px}.course{padding:18px 16px}.course h3{font-size:25px}.xpfx .skip{bottom:calc(18px + env(safe-area-inset-bottom,0px))}.hero::after{background:linear-gradient(0deg,rgba(13,11,22,.96) 40%,rgba(13,11,22,.5))}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.stat b{display:block;font-family:var(--f-hud);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sechead h2{font-family:var(--f-disp);font-size:24px}
.sechead p{margin:0;color:var(--mute)}

.maps{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:720px){.maps{grid-template-columns:1fr}}
.mapcard{position:relative;border-radius:18px;overflow:hidden;min-height:210px;display:flex;align-items:flex-end;text-decoration:none;color:var(--fg);border:2px solid var(--line);transition:transform .18s,border-color .18s}
.mapcard:hover{transform:translateY(-4px);border-color:var(--pc)}
.mapcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.mapcard:hover img{transform:scale(1.05)}
.mapcard::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,8,18,.96) 5%,rgba(10,8,18,.15) 70%)}
.mapcard .in{position:relative;z-index:1;padding:16px 18px;width:100%;display:flex;flex-direction:column;gap:6px}
.mapcard .tag{font-family:var(--f-hud);font-size:18px;letter-spacing:1.5px;color:var(--pc);text-transform:uppercase;line-height:1}
.mapcard h3{font-family:var(--f-disp);font-size:21px;line-height:1.1}
.prog{height:8px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--pc,var(--cyan));border-radius:9px}
.mapcard small{color:#cfc8f0;font-weight:700;font-size:13px}

.banner{position:relative;border-radius:18px;overflow:hidden;min-height:170px;display:flex;align-items:flex-end;border:1px solid var(--line)}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(13,11,22,.96) 10%,rgba(13,11,22,.35))}
.banner .in{position:relative;z-index:1;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.banner h1{font-family:var(--f-disp);font-size:clamp(24px,4vw,36px);line-height:1.08}
.banner p{margin:0;color:#ddd6ff}
.crumb{font-family:var(--f-hud);font-size:19px;letter-spacing:1px;text-transform:uppercase;color:var(--pc,var(--yel));text-decoration:none;line-height:1}

.rounds{display:flex;flex-direction:column;gap:10px}
.round{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;text-decoration:none;color:var(--fg)}
.round:hover{border-color:var(--pc);background:var(--panel2)}
.round .num{font-family:var(--f-hud);font-size:42px;line-height:1;color:var(--pc);text-align:center}
.round h3{font-size:18px;font-weight:800}
.round p{margin:0;color:var(--mute);font-size:14px}
.round .st{display:flex;gap:8px;align-items:center;font-family:var(--f-hud);font-size:19px;color:var(--mute);white-space:nowrap}
@media (max-width:560px){.round{grid-template-columns:40px 1fr}.round .st{grid-column:2}}
.pips{display:flex;gap:5px}.pips i{width:11px;height:11px;border-radius:2px;background:var(--line);transform:rotate(45deg)}.pips i.on{background:var(--pc)}.pips i.bonus{outline:1px dashed var(--mute)}.pips i.bonus.on{background:var(--yel);outline:0}
.badge{font-family:var(--f-hud);font-size:18px;line-height:1;padding:5px 9px 3px;border-radius:6px;background:var(--panel2);white-space:nowrap;letter-spacing:.5px}
.badge.ok{color:var(--bg);background:var(--good)}

.segs{display:flex;gap:6px;background:var(--panel);padding:5px;border-radius:12px;border:1px solid var(--line);width:max-content;max-width:100%;overflow-x:auto}
.segs button{border:0;background:transparent;color:var(--mute);font-family:var(--f-hud);font-size:22px;letter-spacing:1px;text-transform:uppercase;padding:2px 16px;border-radius:8px;line-height:1.3;white-space:nowrap}
.segs button.on{background:var(--pc,var(--yel));color:var(--bg)}

.course{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:12px;max-width:820px}
.course h3{font-family:var(--f-hud);font-size:28px;letter-spacing:.5px;text-transform:uppercase;color:var(--pc);line-height:1;margin-top:10px}
.course p{margin:0;max-width:72ch}
.course .def,.course .form,.course .trap{border-radius:12px;padding:12px 14px;max-width:72ch}
.course .def{background:color-mix(in srgb,var(--cyan) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--cyan) 45%,transparent)}
.course .form{background:#0a0912;border:1px dashed var(--yel);font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:14px;line-height:1.75;color:#ffe99a;overflow-x:auto}
.course .trap{background:color-mix(in srgb,var(--red) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--red) 50%,transparent)}
.course .def::before,.course .form::before,.course .trap::before{display:block;font-family:var(--f-hud);font-size:16px;letter-spacing:1.5px;line-height:1;margin-bottom:6px}
.course .def::before{content:"DÉFINITION";color:var(--cyan)}
.course .form::before{content:"FORMULES";color:var(--yel)}
.course .trap::before{content:"PIÈGE / À RETENIR";color:var(--red)}

.missions{display:flex;flex-direction:column;gap:16px}
.mission{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:16px;padding:18px clamp(14px,2.5vw,22px);display:flex;flex-direction:column;gap:12px;max-width:880px}
.mhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ttag{font-family:var(--f-hud);font-size:17px;letter-spacing:1.5px;line-height:1;padding:5px 9px 3px;border-radius:6px;background:var(--tc);color:var(--bg);text-transform:uppercase}
.btag{font-family:var(--f-hud);font-size:17px;letter-spacing:1.5px;line-height:1;padding:4px 8px 2px;border-radius:6px;border:1px solid var(--yel);color:var(--yel);text-transform:uppercase}
.mhead h3{font-size:19px;font-weight:800;flex:1;min-width:160px}
.xp{font-family:var(--f-hud);font-size:21px;color:var(--yel);line-height:1;white-space:nowrap}
.mission .ctx{color:#d8d1f7;margin:0}
.mission code{background:#0a0912;padding:1px 6px;border-radius:5px;color:#ffe99a;font-size:14px}
.part{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.part .q{margin:0;font-weight:800}
.part .q .pk{font-family:var(--f-hud);font-weight:600;letter-spacing:1px;color:var(--tc);margin-right:6px;font-size:18px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;background:var(--panel2);border-radius:10px;padding:8px 10px;border:2px solid transparent}
.field label{font-size:14px;color:#d8d1f7;font-weight:700}
input.num,input.txt,select{background:#0a0912;color:var(--fg);border:2px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0;width:100%}
input.num{font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{border-color:var(--tc,var(--cyan));outline:none}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{min-height:44px;display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:2px solid transparent;border-radius:10px;padding:8px 12px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--tc)}
.clsrow{display:grid;grid-template-columns:1fr minmax(160px,230px);gap:10px;align-items:center;background:var(--panel2);border:2px solid transparent;border-radius:10px;padding:6px 10px}
@media (max-width:560px){.clsrow{grid-template-columns:1fr}}
.tabwrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table.t{border-collapse:collapse;width:100%;min-width:480px;font-size:14px}
table.t td:first-child{min-width:120px}
table.t td input.num{min-width:86px}
table.t td select{min-width:110px}
.tabhint{display:none;font-size:12px;color:var(--dim)}
@media (max-width:620px){.tabhint{display:block}}
table.t th{background:var(--panel2);font-family:var(--f-hud);font-size:18px;letter-spacing:.8px;font-weight:600;text-align:left;padding:6px 10px;text-transform:uppercase;color:var(--mute)}
table.t td{border-top:1px solid var(--line);padding:6px 8px;font-variant-numeric:tabular-nums}
table.t td input,table.t td select{padding:5px 8px}
.trou{line-height:2.4;background:var(--panel2);border-radius:10px;padding:10px 14px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:14px}
.trou input{width:auto;min-width:110px;display:inline-block;padding:3px 8px;font-family:inherit}
textarea{width:100%;min-height:130px;resize:vertical;background:#0a0912;color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:15px;line-height:1.5}
.chart{background:#0a0912;border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart .ct{font-family:var(--f-hud);font-size:19px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin:0 0 4px 4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:4px 4px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.is-ok{border-color:var(--good)!important}
.is-ko{border-color:var(--bad)!important}
.expect{font-size:13px;font-weight:800;color:var(--good)}
.expect.bad{color:var(--bad)}
.crit{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.crit li{padding-left:22px;position:relative}
.crit li::before{position:absolute;left:0;font-weight:900}
.crit li.y::before{content:"✓";color:var(--good)}
.crit li.n::before{content:"✗";color:var(--bad)}
.verdict{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#0f0d1a;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.score{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-hud);font-size:36px;line-height:1;flex:none}
.score small{font-size:15px;color:var(--mute)}
.verdict b{font-family:var(--f-disp);font-size:20px;line-height:1.15;display:block}
.corbox{background:#0f0d1a;border:1px solid var(--yel);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.corbox h4{font-family:var(--f-hud);font-size:20px;letter-spacing:1px;text-transform:uppercase;color:var(--yel);font-weight:600}
.corbox p{margin:0;white-space:pre-wrap}
.lockcor{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:6px}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:4px 14px;font-family:var(--f-hud);font-size:19px;letter-spacing:1px;text-transform:uppercase;line-height:1.3}
.chip.on{border-color:var(--cc,var(--yel));background:color-mix(in srgb,var(--cc,var(--yel)) 22%,var(--panel))}
.hist{display:flex;flex-direction:column;gap:10px}
.hrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:12px;padding:10px 14px}
.hrow h3{font-size:16px;font-weight:800}
.hrow p{margin:0;font-size:13px;color:var(--mute)}
.hsc{font-family:var(--f-hud);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
@media (max-width:620px){.hrow{grid-template-columns:auto 1fr}.hrow .hsc,.hrow .btn{grid-column:2}}
.empty{background:var(--panel);border:2px dashed var(--line);border-radius:18px;padding:30px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font-family:var(--f-disp);font-size:20px}

.ranks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:820px){.ranks{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.ranks{grid-template-columns:1fr}}
.rk{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;position:relative}
.rk .gem{width:62px;height:62px}
.rk h3{font-family:var(--f-disp);font-size:19px;color:var(--rc)}
.rk p{margin:0;font-family:var(--f-hud);font-size:20px;color:var(--mute);line-height:1.1}
.rk.cur{border-color:var(--rc);box-shadow:0 0 0 3px color-mix(in srgb,var(--rc) 25%,transparent)}
.rk.lock{opacity:.5}
.rk .you{position:absolute;top:-10px;right:12px;background:var(--rc);color:var(--bg);font-family:var(--f-hud);font-size:16px;padding:2px 8px 0;border-radius:6px;letter-spacing:1px}
.howxp{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.howxp ul{margin:6px 0 0;padding-left:20px}

.scan{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
@media (max-width:820px){.scan{grid-template-columns:1fr}}
.drop{border:3px dashed var(--line);border-radius:18px;background:var(--panel);min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;position:relative;overflow:hidden}
.drop.over{border-color:var(--cyan)}
.drop img.prev{max-height:300px;border-radius:12px;object-fit:contain}
.drop .big{font-family:var(--f-disp);font-size:22px}
.reticle{width:74px;height:74px;border:3px solid var(--cyan);border-radius:50%;position:relative}
.reticle::before,.reticle::after{content:"";position:absolute;background:var(--cyan)}
.reticle::before{left:50%;top:-12px;bottom:-12px;width:3px;transform:translateX(-50%)}
.reticle::after{top:50%;left:-12px;right:-12px;height:3px;transform:translateY(-50%)}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--cyan);box-shadow:0 0 18px var(--cyan);animation:scl 1.4s ease-in-out infinite alternate}
@keyframes scl{from{top:8%}to{top:92%}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.panel h3{font-family:var(--f-disp);font-size:19px}
.match{border:2px solid var(--pc);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--pc) 8%,var(--panel))}
.match b.t{font-family:var(--f-disp);font-size:20px;line-height:1.15}
.pbar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.pbar b{display:block;height:100%;background:var(--cyan);width:0;transition:width .2s}

/* XP overlay */
.xpfx{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(60,30,110,.85),rgba(6,5,12,.94) 70%);padding:20px;cursor:pointer;animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
.xpfx .box{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;width:min(440px,100%)}
.xpfx .plus{font-family:var(--f-disp);font-size:clamp(54px,14vw,96px);line-height:1;color:var(--yel);text-shadow:0 6px 0 #6b5400,0 0 40px rgba(255,210,63,.6);animation:punch .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes punch{from{transform:scale(.2) rotate(-8deg);opacity:0}}
.xpfx .why{font-family:var(--f-hud);font-size:24px;letter-spacing:2px;text-transform:uppercase;color:#e3dbff}
.xpfx .gemxl{width:110px;height:110px}
.xpfx .bigbar{width:100%;height:14px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.xpfx .bigbar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--vio),var(--pink))}
.xpfx .rkname{font-family:var(--f-disp);font-size:26px}
.xpfx .promo{font-family:var(--f-disp);font-size:clamp(30px,7vw,50px);color:var(--rc);text-shadow:0 0 30px var(--rc);animation:punch .7s cubic-bezier(.2,1.6,.4,1)}
.xpfx .skip{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.spark{position:absolute;width:8px;height:8px;border-radius:2px;pointer-events:none;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(220%);visibility:hidden;background:var(--panel2);color:var(--fg);border:1px solid var(--line);font-weight:700;padding:10px 18px;border-radius:12px;z-index:80;transition:transform .3s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translateX(-50%);visibility:visible}
footer{color:var(--dim);font-size:13px;text-align:center;padding-block:10px 30px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ---------- pré-contrôles ---------- */
.mission.pcx{border-left-width:6px;background:linear-gradient(180deg,color-mix(in srgb,var(--yel) 6%,var(--panel)),var(--panel) 220px)}
.pctag{font-family:var(--f-hud);font-size:17px;letter-spacing:1.5px;line-height:1;padding:5px 9px 3px;border-radius:6px;background:var(--yel);color:var(--bg);text-transform:uppercase}
.pcmeta{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mute);background:#0f0d1a;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.pcmeta b{color:var(--fg)}
.pcmeta .chrono{padding:6px 12px;font-size:13px;margin-left:auto}
.clock{margin-left:auto;font-family:var(--f-hud);font-size:28px;line-height:1;color:var(--yel);font-variant-numeric:tabular-nums;letter-spacing:1px}
.docs{display:grid;gap:12px}
.doc{background:#f4f1ea;color:#1d1a24;border-radius:12px;padding:14px 16px;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.doc h4{font-family:var(--f-hud);font-size:20px;letter-spacing:.8px;text-transform:uppercase;color:#7a2533;font-weight:600;margin-bottom:6px;line-height:1.1}
.doc .dtxt p{margin:0 0 6px;font-family:Georgia,'Times New Roman',serif;font-size:15.5px;line-height:1.6}
.doc .dtxt code{background:#e4dfd3;color:#3b2a10}
.doc .src{margin:6px 0 0;font-size:12px;color:#6b6475}
.doc .tabwrap{border-color:#cfc8b8}
.doc table.t th{background:#e4dfd3;color:#4a4352}
.doc table.t td{border-top-color:#d8d1c2;color:#1d1a24}
.doc .chart{background:#fff;border-color:#d8d1c2}
.doc .chart svg text{fill:#3a3442!important}
.doc .chart svg line{stroke:#ddd6c8!important}
.doc .legend{color:#4a4352}
.qhead{font-family:var(--f-disp);font-size:20px;margin-top:6px}
.qnum{font-family:var(--f-hud);font-size:22px;letter-spacing:1px;color:var(--yel);text-transform:uppercase;line-height:1;margin-top:8px;margin-bottom:-6px}
@media (max-width:720px){.segs{grid-template-columns:repeat(4,1fr)}.segs button{font-size:16px;padding:5px 2px 3px}.segs .lg{display:none}.doc{padding:12px}.doc .dtxt p{font-size:15px}}

/* ---------- emblèmes de rang ---------- */
.gem svg{overflow:visible}
.rk .gem{width:70px;height:70px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.rk.cur .gem{filter:drop-shadow(0 0 14px var(--rc))}

/* ---------- animation d'XP en anneau ---------- */
.ringwrap{position:relative;width:200px;height:200px;margin:4px auto}
.ringwrap .ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring .trk{fill:none;stroke:rgba(255,255,255,.1);stroke-width:12}
.ring .tick{stroke:rgba(255,255,255,.25);stroke-width:2}
.ring .arc{fill:none;stroke:url(#rgr);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(167,123,255,.8))}
.ring .dot{fill:#fff;filter:drop-shadow(0 0 8px #fff)}
.ringwrap .emb{position:absolute;inset:38px;display:grid;place-items:center;filter:drop-shadow(0 0 18px var(--rc))}
.ringwrap .emb svg{width:100%;height:100%;overflow:visible}
.ringwrap .pct{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font-family:var(--f-hud);font-size:20px;color:var(--mute);letter-spacing:1px}
.ringwrap.pulse .emb{animation:emb-pulse .6s ease-out}
.ringwrap.flash{animation:ring-flash .38s ease-out}
.ringwrap.promoted .emb{animation:emb-in .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes emb-pulse{50%{transform:scale(1.12)}}
@keyframes ring-flash{0%{filter:brightness(1)}50%{filter:brightness(3) drop-shadow(0 0 30px #fff)}100%{filter:brightness(1)}}
@keyframes emb-in{from{transform:scale(.2) rotate(-25deg);opacity:0}}
.spark{position:fixed}

/* Téléphone : règles placées en dernier pour primer sur les styles de base */
@media (max-width:720px){
  .segs{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;overflow:visible}
  .segs button{font-size:18px;padding:5px 4px 3px;letter-spacing:.3px}
  nav.tabs a:hover{background:transparent;color:var(--mute)}
  nav.tabs a.on:hover{color:var(--yel)}
  .mapcard:hover,.btn:hover{transform:none}
  .hrow{padding:10px 12px}
}

/* ---------- mise en page « vraie app » : en-tête et onglets fixes, seul le contenu défile ---------- */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
body::before{display:none}
.hud{position:relative;top:auto;flex:none;padding-top:env(safe-area-inset-top,0px)}
.scroller{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@media (max-width:720px){
  .hud{position:relative}
  nav.tabs{position:fixed;bottom:0}
}

/* ---------- écran de chargement ---------- */
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(800px 500px at 50% 40%,#2b1640,#0d0b16 70%);transition:opacity .5s ease,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash.out .splin{transform:scale(1.08)}
.splin{display:flex;flex-direction:column;align-items:center;gap:16px;transition:transform .5s ease}
.splogo{position:relative;width:64px;height:64px;animation:spspin 1.6s cubic-bezier(.6,0,.4,1) infinite}
.splogo i{position:absolute;width:38px;height:38px;top:13px;border-radius:6px;transform:rotate(45deg)}
.splogo i:first-child{left:2px;background:var(--red)}
.splogo i:last-child{left:24px;background:var(--yel);mix-blend-mode:screen}
@keyframes spspin{0%{transform:rotate(0)}50%{transform:rotate(180deg) scale(.85)}100%{transform:rotate(360deg)}}
.spname{font-family:var(--f-disp);font-size:28px;letter-spacing:1px;animation:spglow 1.6s ease-in-out infinite alternate}
@keyframes spglow{from{text-shadow:0 0 0 transparent}to{text-shadow:0 0 22px rgba(52,225,255,.55)}}
.spbar{width:200px;height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.spbar b{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,var(--cyan),var(--vio),var(--pink));animation:spload 1.1s ease-in-out infinite}
@keyframes spload{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
.sptip{font-family:var(--f-hud);font-size:19px;letter-spacing:2px;text-transform:uppercase;color:var(--mute)}

/* ---------- transitions de pages ---------- */
.view.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.05s}.view.enter>*:nth-child(3){animation-delay:.1s}.view.enter>*:nth-child(4){animation-delay:.15s}.view.enter>*:nth-child(5){animation-delay:.2s}.view.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.view.enter .maps>*,.view.enter .rounds>*,.view.enter .ranks>*,.view.enter .hist>*,.view.enter .stats>*{animation:pop-in .45s cubic-bezier(.2,1.2,.4,1) both}
.view.enter .maps>*:nth-child(2),.view.enter .rounds>*:nth-child(2),.view.enter .ranks>*:nth-child(2),.view.enter .stats>*:nth-child(2),.view.enter .hist>*:nth-child(2){animation-delay:.08s}
.view.enter .maps>*:nth-child(3),.view.enter .rounds>*:nth-child(3),.view.enter .ranks>*:nth-child(3),.view.enter .stats>*:nth-child(3),.view.enter .hist>*:nth-child(3){animation-delay:.14s}
.view.enter .maps>*:nth-child(4),.view.enter .rounds>*:nth-child(4),.view.enter .ranks>*:nth-child(4),.view.enter .stats>*:nth-child(4),.view.enter .hist>*:nth-child(4){animation-delay:.2s}
.view.enter .ranks>*:nth-child(n+5),.view.enter .rounds>*:nth-child(n+5),.view.enter .hist>*:nth-child(n+5){animation-delay:.26s}
@keyframes pop-in{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
#ltab.tabin>*{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.view.enter .hero img,.view.enter .banner img{animation:zoomout 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes zoomout{from{transform:scale(1.08)}to{transform:none}}
.btn{transition:transform .12s,box-shadow .12s,filter .15s}
.btn:active{filter:brightness(1.15)}
.segs button{transition:background .2s,color .2s}
.verdict.reveal{animation:pop-in .5s cubic-bezier(.2,1.4,.4,1) both}
.verdict.reveal .score{animation:ringpop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes ringpop{from{transform:scale(.3) rotate(-90deg);opacity:0}}
.corbox{animation:rise .5s .25s cubic-bezier(.2,.8,.2,1) both}

/* ---------- divers ---------- */
.warn{background:color-mix(in srgb,var(--mid) 14%,var(--panel));border:1px solid var(--mid);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;animation:rise .3s both}
.autosave{margin:0;display:flex;align-items:center;gap:10px;font-weight:700}
.dotok{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:okpulse 2s infinite}
@keyframes okpulse{70%{box-shadow:0 0 0 10px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
details.transfer{border-top:1px dashed var(--line);padding-top:10px}
details.transfer summary{cursor:pointer;color:var(--mute);font-weight:700;font-size:14px;list-style-position:inside}
details.transfer[open]{display:flex;flex-direction:column;gap:10px}
.install{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:linear-gradient(120deg,color-mix(in srgb,var(--cyan) 14%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--cyan) 45%,transparent);border-radius:16px;padding:14px 16px}
@media (max-width:720px){ body.typing nav.tabs{transform:translateY(110%)} nav.tabs{transition:transform .25s} body.typing main{padding-bottom:24px} }
@media (prefers-reduced-motion:reduce){#splash{display:none}}
</style>

<h3>Organisation et individu</h3>
<p>Une <b>organisation</b> = un groupe de personnes qui coordonnent leurs actions et leurs ressources vers un but commun. Trois familles : les <b>entreprises</b> (but lucratif), les <b>organisations publiques</b> (intérêt général), les <b>associations</b> (but non lucratif).</p>
<p>Chaque individu arrive avec ses attentes (salaire, ambiance, apprendre…), l'organisation a les siennes (compétences, implication). La gestion des RH, c'est faire matcher les deux. Un individu devient <b>acteur</b> quand il agit, prend des initiatives et s'implique.</p>
<h3>Les compétences</h3>
<div class="def"><b>Compétence</b> = capacité à mobiliser en situation réelle :<br>• des <b>savoirs</b> (connaissances) ;<br>• des <b>savoir-faire</b> (appliquer en pratique) ;<br>• des <b>savoir-être</b> (comportements : ponctualité, calme, esprit d'équipe).<br><b>Qualification</b> = reconnaissance officielle des compétences (diplôme, titre). On peut être très compétent avec une qualification faible.</div>
<p>On développe les compétences par la formation, le tutorat, la mobilité interne, l'apprentissage sur le terrain… ou on les achète en recrutant.</p>
<h3>La motivation</h3>
<p><b>Extrinsèque</b> : vient de l'extérieur (salaire, primes, peur de la sanction). <b>Intrinsèque</b> : vient de l'intérieur (plaisir, fierté, envie de progresser) ; elle dure plus longtemps.</p>
<p><b>Maslow</b> — pyramide des besoins, du bas vers le haut : physiologiques → sécurité → appartenance → estime → accomplissement. On monte d'un étage quand le précédent est à peu près satisfait (théorie critiquée mais utile).</p>
<p><b>Herzberg</b> — <b>facteurs d'hygiène</b> (salaire, conditions de travail) : mauvais, ils créent de l'insatisfaction ; bons, ils ne motivent pas vraiment. <b>Facteurs moteurs</b> (responsabilités, reconnaissance, intérêt du travail, évolution) : eux motivent réellement.</p>
<h3>La rémunération</h3>
<p>Partie <b>fixe</b> (salaire de base) + partie <b>variable</b> (primes, commissions, intéressement, participation). Individualisée = motive les meilleurs mais peut casser l'esprit d'équipe ; collective = solidarité mais risque de « passager clandestin ».</p>
<div class="form">Salaire net = Salaire brut − Cotisations salariales<br>Coût du travail = Salaire brut + Cotisations patronales</div>
<h3>Communication et conflits</h3>
<p>Communication <b>formelle</b> (prévue : réunions, notes, mails officiels) ou <b>informelle</b> (spontanée). Sens : <b>descendante</b> (direction → salariés), <b>ascendante</b> (salariés → direction), <b>transversale</b> (entre collègues de même niveau).</p>
<p>Régler un conflit : <b>négociation</b> (les parties trouvent un compromis seules), <b>médiation</b> (un tiers neutre aide à dialoguer), <b>arbitrage</b> (un tiers tranche).</p>
<h3>Autonomie, implication, cohésion</h3>
<p>L'<b>autonomie</b> = liberté d'organiser son travail ; l'<b>implication</b> = attachement et envie de s'investir ; la <b>cohésion</b> = force des liens dans le groupe. Les trois se renforcent.</p>
<div class="trap"><b>À retenir</b> : pour « impliquer les salariés », pense à tous les leviers : compétences, motivation, rémunération juste, communication, autonomie — et illustre avec le cas.</div>`});

LESSONS.push({
id:'sgn2', part:'sgn', n:2, titre:"Numérique et intelligence collective",
pitch:"Données, SI, bases de données, SQL, sécurité et RGPD.",
kw:"donnée information connaissance système d'information SI collecter stocker traiter diffuser PGI ERP base de données relationnelle table champ enregistrement clé primaire clé étrangère SQL SELECT FROM WHERE ORDER BY GROUP BY COUNT SUM AVG intranet extranet infobésité intelligence collective travail collaboratif coopération sécurité disponibilité intégrité confidentialité traçabilité phishing rançongiciel données personnelles RGPD CNIL minimisation consentement droit à l'oubli",
cours:`
<h3>Donnée → information → connaissance</h3>
<div class="def"><b>Donnée</b> : élément brut sans contexte (« 7 »).<br><b>Information</b> : donnée mise en forme qui a du sens (« 7 abonnés ont résilié hier »).<br><b>Connaissance</b> : information appropriée qui permet d'agir (« les résiliations montent après chaque hausse de prix, il faut prévenir avant »).</div>
<h3>Le système d'information (SI)</h3>
<div class="def">Ensemble organisé de ressources (humaines, matérielles, logicielles, procédures, données) pour <b>collecter, stocker, traiter et diffuser</b> l'information. Le SI ≠ l'informatique : un tableau blanc en fait partie.</div>
<p><b>PGI / ERP</b> : un logiciel unique avec une base de données unique pour toutes les fonctions (ventes, stocks, compta, paie). + Saisie unique, pas de doublons. − Cher, long à installer, dépendance à l'éditeur.</p>
<h3>Bases de données relationnelles</h3>
<p>Des <b>tables</b> avec des <b>champs</b> (colonnes) et des <b>enregistrements</b> (lignes). La <b>clé primaire</b> identifie chaque ligne de façon unique. La <b>clé étrangère</b> (notée #) renvoie à la clé primaire d'une autre table : elle relie les tables.</p>
<div class="form">SELECT champs<br>FROM tables<br>WHERE conditions (dont la jointure clé étrangère = clé primaire)<br>ORDER BY champ ASC|DESC;<br>Fonctions : COUNT, SUM, AVG, MAX, MIN + GROUP BY</div>
<h3>Circulation de l'information</h3>
<p>Le numérique rend l'info instantanée, abondante (risque d'<b>infobésité</b>), accessible partout. Outils : messagerie, plateformes collaboratives, <b>intranet</b> (réservé aux membres), <b>extranet</b> (ouvert à certains partenaires). Une info de qualité est pertinente, fiable, disponible, à jour, compréhensible.</p>
<h3>Intelligence collective</h3>
<p><b>Intelligence collective</b> : un groupe trouve de meilleures solutions que chaque membre seul. <b>Coopération</b> = chacun sa partie puis on assemble ; <b>collaboration</b> = tout le monde sur le même objet en même temps. Limites : surcharge de notifs, responsabilités floues, inégalités face aux outils.</p>
<h3>Sécurité et données personnelles</h3>
<p>Trois critères : <b>disponibilité</b>, <b>intégrité</b>, <b>confidentialité</b> (+ traçabilité). Menaces : piratage, rançongiciel, phishing, erreur humaine. Réponses : mots de passe robustes, double authentification, sauvegardes, droits d'accès, sensibilisation.</p>
<p><b>RGPD</b> (2018) : finalité précise, <b>minimisation</b>, consentement, durée limitée, sécurité. Droits : accès, rectification, effacement (droit à l'oubli), opposition, portabilité. Contrôle en France : la <b>CNIL</b>.</p>`});

LESSONS.push({
id:'sgn3', part:'sgn', n:3, titre:"Création de valeur et performance",
pitch:"VA, compte de résultat, bilan, amortissement, seuil de rentabilité, prix et indicateurs.",
kw:"valeur ajoutée consommations intermédiaires marge commerciale partage de la valeur ajoutée compte de résultat produits charges résultat d'exploitation financier exceptionnel bilan actif passif capitaux propres dettes immobilisé circulant amortissement linéaire annuité VNC valeur nette comptable charges fixes charges variables marge sur coût variable MCV seuil de rentabilité point mort marge de sécurité coût de revient taux de marge taux de marque TVA HT TTC performance efficacité efficience indicateurs tableau de bord rentabilité financière turnover absentéisme part de marché taux de variation",
cours:`
<h3>Les formes de valeur</h3>
<p>Valeur pour le client (utilité perçue vs prix), pour l'actionnaire (bénéfice), pour les salariés, valeur sociétale, et <b>valeur ajoutée</b> (mesure comptable de la richesse créée).</p>
<div class="form">VA = Production (ou CA) − Consommations intermédiaires<br>Marge commerciale = Ventes de marchandises − Coût d'achat des marchandises vendues<br>Part de la VA au personnel = Charges de personnel ÷ VA × 100</div>
<div class="trap">Les salaires ne sont <b>pas</b> des consommations intermédiaires : ils sont payés avec la VA. La VA se partage entre salariés, État, prêteurs, actionnaires et l'entreprise (réserves).</div>
<h3>Compte de résultat (le « film » de l'année)</h3>
<div class="form">Résultat = Produits − Charges<br>R. d'exploitation + R. financier + R. exceptionnel − Impôt = Résultat net</div>
<h3>Bilan (la « photo » à une date)</h3>
<p><b>Actif</b> (ce qu'on possède) : immobilisé (bâtiments, matériel, logiciels) + circulant (stocks, créances clients, trésorerie). <b>Passif</b> (d'où vient l'argent) : capitaux propres (capital, réserves, résultat) + dettes.</p>
<div class="form">Total actif = Total passif</div>
<h3>Amortissement linéaire</h3>
<div class="form">Annuité = Valeur d'origine ÷ Durée<br>Taux = 100 ÷ Durée<br>VNC = Valeur d'origine − Cumul des amortissements<br>Achat en cours d'année : 1re annuité × (mois utilisés ÷ 12)</div>
<h3>Seuil de rentabilité</h3>
<div class="form">MCV = CA − Charges variables<br>Taux de MCV = MCV ÷ CA<br>SR = Charges fixes ÷ Taux de MCV<br>SR en quantités = Charges fixes ÷ MCV unitaire<br>Point mort = SR ÷ CA × 12 mois<br>Marge de sécurité = CA − SR<br>Résultat = MCV − Charges fixes</div>
<div class="trap">On divise par le <b>taux</b> de MCV, pas par la MCV en euros. Au SR, le résultat vaut 0.</div>
<h3>Coût de revient et prix</h3>
<div class="form">Coût de revient = Coût d'achat + Coût de production + Coût de distribution<br>Prix TTC = HT × (1 + TVA) ; HT = TTC ÷ (1 + TVA)<br>Taux de marge = (PV HT − Coût d'achat HT) ÷ Coût d'achat HT × 100<br>Taux de marque = (PV HT − Coût d'achat HT) ÷ PV HT × 100</div>
<div class="trap">Pour enlever la TVA à 20 %, on divise par 1,2 (on ne retire pas 20 %). Le taux de marque est toujours plus petit que le taux de marge.</div>
<h3>Performance</h3>
<p><b>Efficacité</b> = atteindre ses objectifs ; <b>efficience</b> = les atteindre avec le moins de ressources. Performance économique, commerciale, sociale, environnementale → <b>performance globale</b> (RSE). On pilote avec un <b>tableau de bord</b>.</p>
<div class="form">Taux de variation = (VA − VD) ÷ VD × 100<br>Profitabilité = Résultat net ÷ CA × 100<br>Rentabilité financière = Résultat net ÷ Capitaux propres × 100<br>Part de marché = Ventes entreprise ÷ Ventes du marché × 100<br>Turnover = ((Départs + Arrivées) ÷ 2) ÷ Effectif moyen × 100<br>Absentéisme = Heures d'absence ÷ Heures théoriques × 100</div>
<div class="trap">En copie : calcul → phrase d'interprétation → conséquence pour l'organisation.</div>`});

LESSONS.push({
id:'sgn4', part:'sgn', n:4, titre:"Temps et risque",
pitch:"Intérêts, emprunts, stocks, planning de projet et gestion des risques.",
kw:"temps intérêt simple intérêts composés valeur acquise capital taux durée emprunt annuité amortissements constants annuités constantes tableau de remboursement capital restant dû coût du crédit stock stock de sécurité stock minimum stock d'alerte stock maximum flux tendus juste-à-temps stock moyen durée de stockage rupture Gantt chemin critique antériorité risque probabilité gravité criticité matrice des risques éviter réduire transférer accepter assurance burn-out",
cours:`
<h3>Le temps a une valeur : l'intérêt</h3>
<p>1 € aujourd'hui vaut plus qu'1 € dans un an (on peut le placer, et l'inflation ronge sa valeur).</p>
<div class="form">Intérêts simples : I = C × t × n ; Valeur acquise = C × (1 + t × n)<br>(n en mois : × n/12 ; en jours : × n/360)<br>Intérêts composés : Valeur acquise = C × (1 + t)<sup>n</sup></div>
<p>Avec les intérêts composés, les intérêts produisent eux-mêmes des intérêts : l'écart explose sur longue durée.</p>
<h3>L'emprunt</h3>
<p>Chaque <b>annuité</b> = intérêts + amortissement (remboursement du capital).</p>
<div class="form">Amortissements constants :<br>Amortissement = Montant emprunté ÷ Nombre d'années<br>Intérêt de l'année = Capital restant dû en début d'année × Taux<br>Annuité = Amortissement + Intérêt<br>Coût du crédit = Somme des intérêts</div>
<p>À <b>annuités constantes</b> : on paie la même somme chaque année, la part d'intérêts baisse et la part de capital monte.</p>
<h3>Les stocks</h3>
<p>Le stock évite les ruptures mais coûte (argent immobilisé, place, obsolescence). <b>Stock de sécurité</b> (minimum pour les imprévus), <b>stock d'alerte</b> (déclenche la commande), <b>stock maximum</b>. <b>Flux tendus / juste-à-temps</b> : stocks quasi nuls.</p>
<div class="form">Stock d'alerte = Stock de sécurité + Consommation journalière × Délai de livraison<br>Stock moyen = (SI + SF) ÷ 2<br>Coût d'achat des marchandises vendues = Achats + SI − SF<br>Durée moyenne de stockage = Stock moyen ÷ CAMV × 360</div>
<h3>Gestion de projet</h3>
<p>Le <b>diagramme de Gantt</b> place les tâches en barres sur une ligne du temps. Les <b>antériorités</b> disent quelle tâche doit finir avant une autre. Le <b>chemin critique</b> = l'enchaînement qui fixe la durée totale : un retard dessus retarde tout le projet. Les autres tâches ont une marge.</p>
<h3>Le risque</h3>
<div class="def"><b>Risque</b> : événement possible et incertain aux conséquences négatives. On l'évalue par sa <b>probabilité</b> et sa <b>gravité</b> → <b>criticité</b>, représentée dans une matrice des risques.</div>
<p>Types : financiers, commerciaux, opérationnels, informatiques, juridiques, humains, d'image, environnementaux.</p>
<p>4 réponses : <b>éviter</b> (renoncer), <b>réduire</b> (prévention/protection), <b>transférer</b> (assurance, sous-traitance), <b>accepter</b>.</p>
<div class="trap">Chercher toujours plus de performance crée de nouveaux risques (flux tendus → ruptures ; pression → burn-out, turnover ; délocalisation → risque d'image). Le montrer = copie excellente.</div>`});

LESSONS.push({
id:'mgt1', part:'mgt', n:1, titre:"À la rencontre du management des organisations",
pitch:"Action collective, types d'organisations, finalités, styles de management, décision.",
kw:"action collective organisation division du travail coordination supervision directe standardisation ajustement mutuel entreprise organisation publique association loi 1901 ESS finalité buts objectifs SMART raison d'être société à mission loi PACTE management manager Fayol prévoir organiser commander coordonner contrôler Mintzberg rôles interpersonnels informationnels décisionnels style directif persuasif participatif délégatif situationnel parties prenantes macro-environnement micro-environnement ressources immatérielles décision Simon rationalité limitée",
cours:`
<h3>Pourquoi organiser l'action collective ?</h3>
<p>Beaucoup de projets sont impossibles seul : il faut agir ensemble (<b>action collective</b>) et donc s'organiser : <b>répartir</b> le travail (division du travail) et <b>coordonner</b>.</p>
<p>3 modes de coordination : <b>supervision directe</b> (un chef ordonne), <b>standardisation</b> (procédures, normes), <b>ajustement mutuel</b> (on se parle et on s'adapte).</p>
<h3>Trois familles d'organisations</h3>
<p><b>Entreprises</b> : finalité lucrative, ressources issues des ventes ; micro (&lt; 10 salariés), PME (&lt; 250), ETI (250-5 000), grandes (&gt; 5 000). <b>Organisations publiques</b> : intérêt général, services non marchands financés par impôts et cotisations ; principes d'égalité et de continuité. <b>Associations</b> (loi 1901) : non lucratives ; elles peuvent faire des bénéfices mais pas les distribuer ; cotisations, subventions, dons, bénévolat. <b>ESS</b> : associations, coopératives, mutuelles, fondations, gouvernance démocratique.</p>
<h3>Finalité → buts → objectifs</h3>
<p><b>Finalité</b> : raison d'être. <b>Buts</b> : orientations de long terme. <b>Objectifs</b> : résultats précis, chiffrés, datés.</p>
<div class="def"><b>SMART</b> : Spécifique, Mesurable, Atteignable, Réaliste, Temporellement défini.</div>
<p>Loi <b>PACTE</b> (2019) : raison d'être dans les statuts, possibilité de devenir <b>société à mission</b>.</p>
<h3>Le manager</h3>
<p><b>Fayol</b> : prévoir, organiser, commander, coordonner, contrôler. <b>Mintzberg</b> : rôles interpersonnels, informationnels, décisionnels. Styles : <b>directif</b>, <b>persuasif</b>, <b>participatif</b>, <b>délégatif</b> ; le bon manager adapte son style (<b>management situationnel</b>).</p>
<h3>Environnement et parties prenantes</h3>
<p><b>Macro-environnement</b> (grandes tendances) et <b>micro-environnement</b> (clients, fournisseurs, concurrents…). Les <b>parties prenantes</b> ont un intérêt dans l'organisation ; leurs attentes peuvent se contredire.</p>
<h3>Ressources et décision</h3>
<p>Ressources humaines, financières, matérielles, <b>immatérielles</b> (marque, brevets, données, réputation). Processus de décision selon <b>Simon</b> : intelligence → conception → sélection → mise en œuvre/évaluation. <b>Rationalité limitée</b> : info incomplète, temps limité, biais → on choisit une solution <b>satisfaisante</b>, pas optimale.</p>`});

LESSONS.push({
id:'mgt2', part:'mgt', n:2, titre:"Du diagnostic à la fixation des objectifs",
pitch:"Niveaux de décision, stratégie, PESTEL, 5 forces de Porter, SWOT.",
kw:"décision stratégique tactique opérationnelle Ansoff stratégie avantage concurrentiel management stratégique diagnostic externe opportunités menaces PESTEL politique économique socioculturel technologique écologique légal Porter cinq forces rivalité nouveaux entrants produits de substitution pouvoir de négociation clients fournisseurs diagnostic interne forces faiblesses ressources compétences distinctives chaîne de valeur SWOT FFOM objectifs stratégiques stratégie délibérée émergente",
cours:`
<h3>Les trois niveaux de décision (Ansoff)</h3>
<p><b>Stratégiques</b> : long terme, orientation générale, gros moyens, peu réversibles, direction générale. <b>Tactiques</b> (administratives) : moyen terme, mise en œuvre de la stratégie, cadres intermédiaires. <b>Opérationnelles</b> : court terme, quotidien, répétitives, réversibles.</p>
<div class="trap">La « tactique » au foot (système de jeu) n'a pas le même sens qu'en management.</div>
<h3>La stratégie</h3>
<div class="def">Ensemble des choix de long terme pour atteindre ses objectifs en tenant compte de l'environnement et des ressources ; viser un <b>avantage concurrentiel durable</b>. Démarche : diagnostic → objectifs → choix → mise en œuvre → contrôle.</div>
<h3>Diagnostic externe : opportunités / menaces</h3>
<p><b>PESTEL</b> : Politique, Économique, Socioculturel, Technologique, Écologique, Légal. Pour chaque point, dire si c'est une opportunité ou une menace pour l'organisation étudiée.</p>
<p><b>5 forces de Porter</b> : rivalité entre concurrents, menace des nouveaux entrants, menace des produits de substitution, pouvoir de négociation des clients, pouvoir des fournisseurs (+ souvent l'État). Plus elles sont fortes, moins le secteur est rentable.</p>
<h3>Diagnostic interne : forces / faiblesses</h3>
<p>On analyse ressources et compétences. Les <b>compétences distinctives</b> : ce que l'organisation fait mieux que les autres, difficile à copier, utile aux clients → source de l'avantage concurrentiel. La <b>chaîne de valeur</b> de Porter découpe l'activité pour voir où se crée la valeur.</p>
<h3>SWOT</h3>
<div class="def">Interne : <b>S</b>trengths (forces), <b>W</b>eaknesses (faiblesses). Externe : <b>O</b>pportunities, <b>T</b>hreats (menaces).</div>
<div class="trap">Ne mélange jamais interne et externe : l'organisation contrôle ses forces/faiblesses, elle subit les opportunités/menaces.</div>
<h3>Fixer les objectifs</h3>
<p>Objectifs économiques, sociaux, sociétaux/environnementaux, de pérennité, déclinés par service. Ils peuvent se contredire : le manager arbitre. Stratégie <b>délibérée</b> (planifiée) ou <b>émergente</b> (se construit au fil des opportunités) — souvent un mélange (Mintzberg).</p>`});

LESSONS.push({
id:'mgt3', part:'mgt', n:3, titre:"Les choix stratégiques des organisations",
pitch:"DAS, stratégies de Porter, diversification, intégration, croissance, international.",
kw:"domaine d'activité stratégique DAS facteurs clés de succès stratégies génériques Porter domination par les coûts économies d'échelle effet d'expérience différenciation focalisation niche spécialisation diversification liée concentrique conglomérale intégration verticale amont aval horizontale externalisation sous-traitance croissance interne externe fusion acquisition alliance partenariat joint-venture franchise internationalisation délocalisation organisations publiques régie délégation de service public partenariat public-privé associations stratégie",
cours:`
<h3>Domaines d'activité stratégique</h3>
<div class="def"><b>DAS</b> : sous-ensemble d'activités avec ses propres clients, concurrents, technologies et <b>facteurs clés de succès</b> (FCS : ce qu'il faut absolument maîtriser pour réussir).</div>
<h3>Stratégies concurrentielles (Porter)</h3>
<p><b>Domination par les coûts</b> : produire moins cher grâce aux <b>économies d'échelle</b> et à l'<b>effet d'expérience</b> ; risque : guerre des prix, image bas de gamme.<br><b>Différenciation</b> : produit perçu comme unique → prix plus élevé ; risque : clients pas prêts à payer, imitation.<br><b>Focalisation</b> (niche) : un segment étroit, par les coûts ou la différenciation ; risque : niche trop petite ou attaquée.</p>
<h3>Stratégies globales</h3>
<p><b>Spécialisation</b> : un seul métier (expertise, image claire, mais tous les œufs dans le même panier). <b>Diversification</b> : nouvelles activités, <b>liée</b> (concentrique : mêmes technos ou clients) ou <b>non liée</b> (conglomérale) ; répartit le risque mais disperse.</p>
<p><b>Intégration verticale</b> : prendre en charge les étapes <b>amont</b> (fournisseurs) ou <b>aval</b> (distribution). <b>Intégration horizontale</b> : racheter/s'allier à des concurrents. <b>Externalisation</b> : confier une activité à un sous-traitant pour se recentrer sur son cœur de métier (risque : dépendance, perte de compétences).</p>
<h3>Modalités de croissance</h3>
<p><b>Interne</b> (par ses propres investissements : maîtrise mais lent). <b>Externe</b> (acquisition, fusion : rapide mais coûteux, problèmes d'intégration, contrôle des autorités de concurrence). <b>Alliances</b> (joint-venture, partenariat, franchise, licence : partage des coûts et risques, mais dépendance). <b>Internationalisation</b> : exporter, s'implanter, délocaliser (nouveaux marchés, coûts) avec risques culturels, politiques, de change.</p>
<h3>Organisations publiques et associations</h3>
<p>Publiques : quels services, quelle qualité, quel financement, gestion en <b>régie</b> ou <b>délégation de service public</b>, <b>partenariat public-privé</b> ; principes : égalité, continuité, adaptabilité ; indicateurs : satisfaction, délais, coût par usager.</p>
<p>Associations : développer les activités, <b>diversifier les ressources</b> (mécénat, événements), se professionnaliser, fidéliser bénévoles et adhérents.</p>`});

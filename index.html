LESSONS.push({
id:'droit1', part:'droit', n:1, titre:"Qu'est-ce que le droit ?",
pitch:"Caractères de la règle de droit, branches, sources et hiérarchie des normes.",
kw:"droit objectif droit subjectif règle de droit générale impersonnelle obligatoire coercitive permanente impérative ordre public supplétive règle morale religieuse fonctions du droit droit public droit privé droit constitutionnel administratif fiscal civil commercial travail consommation pénal sources du droit hiérarchie des normes pyramide de Kelsen Constitution 1958 DDHC bloc de constitutionnalité Conseil constitutionnel QPC traités règlement européen directive transposition loi Parlement navette promulgation Journal officiel ordonnance décret arrêté jurisprudence Cour de cassation coutume doctrine",
cours:`
<h3>La règle de droit</h3>
<div class="def"><b>Droit objectif</b> : ensemble des règles qui organisent la vie en société, garanties par l'État. <b>Droit subjectif</b> : prérogative d'une personne (droit de propriété, à la vie privée…).</div>
<p>4 caractères : <b>générale et impersonnelle</b> (vise tout le monde dans la même situation) ; <b>obligatoire</b> (règles <b>impératives</b> d'ordre public auxquelles on ne peut déroger, ou <b>supplétives</b> qui s'appliquent si on n'a rien prévu) ; <b>coercitive</b> (sanctionnée par l'État) ; <b>permanente</b> (de l'entrée en vigueur à l'abrogation).</p>
<p>Seule la règle de droit est sanctionnée par l'État (≠ règles morales, religieuses, de politesse). Fonctions du droit : organiser la société, pacifier, protéger les plus faibles, accompagner les évolutions.</p>
<h3>Les branches</h3>
<p><b>Droit public</b> (une personne publique agit avec ses prérogatives) : constitutionnel, administratif, fiscal, international public. <b>Droit privé</b> (relations entre personnes privées) : civil, commercial, travail, consommation. Le <b>droit pénal</b> est à part (rattaché au privé, dimension publique forte).</p>
<h3>Hiérarchie des normes (pyramide de Kelsen)</h3>
<div class="form">Bloc de constitutionnalité (Constitution 1958, DDHC 1789, Préambule 1946, Charte de l'environnement 2004)<br>▼ Traités internationaux et droit de l'UE<br>▼ Lois (Parlement) et ordonnances<br>▼ Règlements : décrets, arrêtés<br>▼ Contrats, conventions collectives</div>
<p>Le <b>Conseil constitutionnel</b> contrôle les lois ; la <b>QPC</b> (depuis 2010) permet à un justiciable de contester une loi lors d'un procès. Droit de l'UE : <b>règlement</b> = directement applicable ; <b>directive</b> = objectif à <b>transposer</b>.</p>
<p>La <b>loi</b> : projet (gouvernement) ou proposition (parlementaires) → navette entre Assemblée et Sénat → promulgation par le Président → publication au Journal officiel. Domaines de la loi : article 34 ; règlements : article 37.</p>
<p>Sources complémentaires : <b>jurisprudence</b> (décisions des tribunaux, surtout Cour de cassation), <b>coutume</b> (usage répété jugé obligatoire), <b>doctrine</b> (écrits des juristes, sans force obligatoire).</p>`});

LESSONS.push({
id:'droit2', part:'droit', n:2, titre:"Comment le droit règle un désaccord",
pitch:"Preuve, modes alternatifs, organisation judiciaire, principes du procès.",
kw:"preuve charge de la preuve article 1353 fait juridique acte juridique 1500 euros preuve libre écrit acte authentique acte sous signature privée écrit électronique témoignage aveu serment présomption loyauté de la preuve commencement de preuve par écrit modes alternatifs négociation transaction conciliation conciliateur médiation médiateur arbitrage sentence arbitrale TAS ordre judiciaire ordre administratif Cour de cassation Conseil d'État Tribunal des conflits tribunal judiciaire tribunal de commerce conseil de prud'hommes contravention délit crime tribunal de police tribunal correctionnel cour d'assises appel cour d'appel arrêt jugement pourvoi procès équitable contradictoire droits de la défense impartialité présomption d'innocence intérêt à agir prescription",
cours:`
<h3>La preuve</h3>
<p>« Celui qui réclame l'exécution d'une obligation doit la prouver » (art. 1353 C. civ.) : la <b>charge de la preuve</b> pèse sur le demandeur.</p>
<p><b>Fait juridique</b> (événement aux effets non voulus : accident, dommage) → preuve <b>libre</b> (tout moyen). <b>Acte juridique</b> (volonté de produire des effets : contrat) → <b>écrit</b> obligatoire au-delà de <b>1 500 €</b> ; exceptions : entre commerçants preuve libre, impossibilité de se procurer un écrit, commencement de preuve par écrit.</p>
<div class="def">Modes de preuve : <b>écrit</b> (acte authentique rédigé par un officier public = force maximale ; acte sous signature privée ; écrit électronique = même valeur s'il identifie l'auteur et garantit l'intégrité), <b>témoignage</b>, <b>aveu</b>, <b>serment</b>, <b>présomptions</b>.</div>
<p>La preuve doit être <b>loyale</b> ; en matière civile, une preuve déloyale peut être admise si elle est indispensable et l'atteinte proportionnée (Cass. ass. plén., déc. 2023).</p>
<h3>Modes alternatifs de règlement</h3>
<p><b>Négociation</b> (accord direct ; écrit avec concessions = <b>transaction</b>). <b>Conciliation</b> (conciliateur de justice gratuit, peut proposer des solutions). <b>Médiation</b> (médiateur neutre aide à rétablir le dialogue). <b>Arbitrage</b> (arbitres privés choisis, <b>sentence</b> qui s'impose ; ex. TAS pour le sport).</p>
<h3>Organisation judiciaire</h3>
<p><b>Ordre judiciaire</b> (litiges privés + pénal ; sommet : Cour de cassation) / <b>ordre administratif</b> (litiges avec l'administration ; sommet : Conseil d'État). Doute → Tribunal des conflits.</p>
<p>1er degré civil : <b>tribunal judiciaire</b> (droit commun, avec le juge des contentieux de la protection), <b>tribunal de commerce</b> (commerçants), <b>conseil de prud'hommes</b> (salarié/employeur). Pénal : contraventions → tribunal de police ; délits → tribunal correctionnel ; crimes → cour d'assises (ou cour criminelle départementale).</p>
<p>2e degré : <b>cour d'appel</b> (rejuge en fait et en droit ; rend un <b>arrêt</b>). Pas d'appel sous 5 000 €. <b>Cour de cassation</b> : juge du droit, pas des faits ; rejette le pourvoi ou casse et renvoie.</p>
<h3>Le procès</h3>
<p>Procès équitable (art. 6 CEDH) : contradictoire, droits de la défense, impartialité, publicité, délai raisonnable, double degré, motivation, présomption d'innocence. Acteurs : demandeur/défendeur (appelant/intimé), avocats, juges du siège, parquet, greffiers, commissaires de justice. Pour agir : intérêt et qualité à agir, délai de prescription (5 ans en civil).</p>
<div class="trap">Méthode juridiction : qui sont les parties ? objet et montant ? civil ou pénal ? judiciaire ou administratif ? quelle juridiction ? quels recours ? Toujours justifier.</div>`});

LESSONS.push({
id:'droit3', part:'droit', n:3, titre:"Qui peut faire valoir ses droits ?",
pitch:"Personnalité juridique, identification, capacité, personne morale, patrimoine.",
kw:"personnalité juridique sujet de droit personne physique personne morale objet de droit animaux naissance vivant et viable infans conceptus décès absence disparition nom prénom pseudonyme domicile résidence état civil capacité de jouissance capacité d'exercice mineur autorité parentale actes de la vie courante émancipation majeurs protégés sauvegarde de justice curatelle tutelle habilitation familiale mandat de protection future personne morale de droit public privé immatriculation RCS déclaration en préfecture dénomination sociale siège social principe de spécialité dissolution patrimoine actif passif Aubry et Rau entrepreneur individuel gage général des créanciers",
cours:`
<h3>La personnalité juridique</h3>
<div class="def">Aptitude à être titulaire de droits et d'obligations (= <b>sujet de droit</b>). Deux catégories : <b>personnes physiques</b> (humains) et <b>personnes morales</b> (sociétés, associations, État, communes). Animaux (« êtres vivants doués de sensibilité » depuis 2015), choses, IA = objets de droit.</div>
<h3>Personne physique</h3>
<p>Début : naissance <b>vivant et viable</b> ; exception <i>Infans conceptus</i> : l'enfant conçu est considéré né chaque fois que c'est dans son intérêt. Fin : décès (cas d'absence et de disparition).</p>
<p>Identification : <b>nom</b> (immuable, imprescriptible, incessible ; choix depuis 2005, changement simplifié une fois depuis 2022), <b>prénom</b>, <b>domicile</b> (lieu du principal établissement, ≠ résidence), <b>état civil</b>. Le <b>pseudonyme</b> n'est pas le nom : on peut le choisir, en changer, le déposer comme marque.</p>
<h3>La capacité</h3>
<div class="def"><b>Capacité de jouissance</b> : être titulaire de droits (tout le monde). <b>Capacité d'exercice</b> : exercer seul ses droits (limitée pour les mineurs et majeurs protégés).</div>
<p><b>Mineurs</b> : représentés par leurs parents (autorité parentale) ; peuvent faire seuls les <b>actes de la vie courante</b>. Émancipation possible dès 16 ans par le juge.</p>
<p><b>Majeurs protégés</b> (juge des contentieux de la protection), du plus léger au plus lourd : <b>sauvegarde de justice</b> (temporaire), <b>curatelle</b> (assistance), <b>tutelle</b> (représentation). Aussi : habilitation familiale, mandat de protection future. Principes : nécessité, subsidiarité, proportionnalité.</p>
<h3>Personne morale</h3>
<p>Groupement doté d'une personnalité distincte de ses membres : propre patrimoine, droits, obligations. <b>Droit public</b> (État, collectivités, établissements publics) / <b>droit privé</b> (sociétés, associations déclarées, syndicats, fondations).</p>
<p>Naissance : <b>immatriculation au RCS</b> (société) ; <b>déclaration en préfecture + publication au JO</b> (association). Fin : dissolution puis liquidation. Identification : dénomination sociale, siège social, nationalité. Agit via ses représentants ; peut être pénalement responsable. <b>Principe de spécialité</b> : agit dans la limite de son objet social.</p>
<h3>Le patrimoine</h3>
<p>Ensemble des biens, droits et obligations évaluables en argent : actif + passif. Théorie d'<b>Aubry et Rau</b> : seules les personnes ont un patrimoine, toute personne en a un, une personne n'en a qu'un. Assouplie : depuis 2022, l'entrepreneur individuel a un patrimoine professionnel séparé. Le patrimoine est le <b>gage général</b> des créanciers.</p>`});

LESSONS.push({
id:'droit4', part:'droit', n:4, titre:"Les droits reconnus aux personnes",
pitch:"Droits extrapatrimoniaux, propriété, biens, droit d'auteur, brevets, marques.",
kw:"droits extrapatrimoniaux droits de la personnalité incessibles intransmissibles insaisissables imprescriptibles respect du corps humain vie privée article 9 droit à l'image honneur réputation diffamation injure loi 1881 présomption d'innocence liberté d'expression droits patrimoniaux droits réels droits personnels créance droit de propriété article 544 usus fructus abusus absolu exclusif perpétuel démembrement usufruit nue-propriété abus de droit troubles anormaux de voisinage expropriation biens corporels meubles immeubles par nature par destination possession vaut titre article 2276 prescription acquisitive accession biens incorporels propriété intellectuelle droit d'auteur œuvre originale droits moraux droits patrimoniaux reproduction représentation 70 ans domaine public droits voisins contrefaçon SACEM sample brevet INPI 20 ans marque 10 ans dessins et modèles fonds de commerce clientèle licence",
cours:`
<h3>Droits extrapatrimoniaux (de la personnalité)</h3>
<p>Pas de valeur en argent ; <b>incessibles, intransmissibles, insaisissables, imprescriptibles</b>. Principaux : respect du <b>corps humain</b> (art. 16 : inviolable, non patrimonial) ; <b>vie privée</b> (art. 9) ; <b>droit à l'image</b> (limites : personnes publiques dans leur activité, actualité, foule non cadrée) ; <b>honneur</b> contre la <b>diffamation</b> (fait précis portant atteinte à l'honneur) et l'<b>injure</b> (expression outrageante sans fait précis) — loi du 29 juillet 1881, valable sur les réseaux ; <b>présomption d'innocence</b> (art. 9-1). Le juge les met en balance avec la liberté d'expression.</p>
<h3>Droits patrimoniaux et propriété</h3>
<p>Droits <b>réels</b> (sur une chose), <b>personnels</b> (créances : exiger quelque chose de quelqu'un), <b>intellectuels</b>.</p>
<div class="def"><b>Propriété</b> (art. 544) : « droit de jouir et disposer des choses de la manière la plus absolue » dans le respect des lois. Attributs : <b>usus</b> (utiliser), <b>fructus</b> (percevoir les revenus), <b>abusus</b> (vendre, donner, détruire). Caractères : <b>absolu, exclusif, perpétuel</b>.</div>
<p><b>Démembrement</b> : usufruitier (usus + fructus) / nu-propriétaire (abusus). Limites : abus de droit, troubles anormaux de voisinage, urbanisme, expropriation pour utilité publique avec juste et préalable indemnité.</p>
<h3>Biens corporels</h3>
<p><b>Immeubles</b> par nature (sol, bâtiments) ou par destination (meuble attaché à un immeuble). <b>Meubles</b> par nature ou par anticipation. Immeuble : vente chez le notaire + publicité. Meubles : « <b>en fait de meubles, la possession vaut titre</b> » (art. 2276) ; bien perdu ou volé revendicable 3 ans. Acquisition : contrat, succession, accession, prescription acquisitive (30 ans, ou 10 ans de bonne foi avec juste titre), occupation.</p>
<h3>Propriété intellectuelle</h3>
<p><b>Droit d'auteur</b> : œuvre <b>originale</b> (empreinte de la personnalité) et <b>formalisée</b> (une idée seule n'est pas protégée) ; protection <b>sans dépôt</b>. Droits <b>moraux</b> (divulgation, paternité, respect, retrait/repentir ; perpétuels, inaliénables) + droits <b>patrimoniaux</b> (reproduction, représentation ; vie + 70 ans, puis domaine public). <b>Droits voisins</b> : artistes-interprètes, producteurs. Utilisation sans autorisation = <b>contrefaçon</b> (exceptions : copie privée, courte citation, parodie, usage pédagogique).</p>
<p><b>Brevet</b> : invention nouvelle, inventive, application industrielle ; dépôt INPI ; monopole <b>20 ans</b>. <b>Marque</b> : signe distinctif, disponible, licite ; dépôt INPI/EUIPO/OMPI ; <b>10 ans</b> renouvelables. <b>Dessins et modèles</b> : apparence ; 5 ans renouvelables jusqu'à 25.</p>
<p><b>Fonds de commerce</b> : bien meuble incorporel (clientèle, nom commercial, enseigne, droit au bail, marques + matériel, marchandises ; pas les murs).</p>`});

LESSONS.push({
id:'eco1', part:'eco', n:1, titre:"Les grandes questions économiques",
pitch:"Rareté, coût d'opportunité, agents, circuit économique et grands enjeux.",
kw:"rareté besoins primaires secondaires bien service coût d'opportunité que produire comment pour qui économie de marché planifiée mixte agents économiques ménages entreprises sociétés non financières administrations publiques institutions financières ISBLSM reste du monde circuit économique flux réels monétaires interdépendance croissance PIB chômage taux de chômage population active inflation IPC pouvoir d'achat inégalités développement durable Brundtland mondialisation numérique indice base 100 points",
cours:`
<h3>Rareté et choix</h3>
<p>Les ressources sont limitées, les besoins presque illimités : il faut <b>choisir</b>. Besoins <b>primaires</b> (vitaux) et <b>secondaires</b>. <b>Bien</b> = matériel ; <b>service</b> = immatériel.</p>
<div class="def"><b>Coût d'opportunité</b> : valeur de la meilleure option à laquelle on renonce en faisant un choix (argent, temps, plaisir…).</div>
<p>Trois questions : <b>que</b> produire, <b>comment</b>, <b>pour qui</b>. Économie de marché, planifiée, ou <b>mixte</b> (France).</p>
<h3>Les agents économiques</h3>
<p><b>Ménages</b> (consommer ; fournissent le travail, épargnent) ; <b>entreprises</b> (produire des biens et services marchands) ; <b>administrations publiques</b> (services non marchands, redistribution, financées par les prélèvements obligatoires) ; <b>institutions financières</b> (financer, assurer) ; <b>ISBLSM</b> (associations, syndicats…) ; <b>reste du monde</b>.</p>
<h3>Le circuit économique</h3>
<p>Flux <b>réels</b> (biens, services, travail) et flux <b>monétaires</b> en contrepartie : travail ↔ salaires, biens ↔ consommation, impôts → services publics/prestations, épargne → crédits, exportations ⇄ importations. Il montre l'<b>interdépendance</b> : si un maillon ralentit, tout ralentit.</p>
<h3>Les grands enjeux</h3>
<p><b>Croissance</b> (hausse du PIB), <b>emploi/chômage</b>, <b>inflation</b> (hausse générale et durable des prix, mesurée par l'IPC de l'INSEE), <b>inégalités</b>, <b>développement durable</b> (Brundtland 1987 : répondre aux besoins présents sans compromettre ceux des générations futures ; 3 piliers), <b>mondialisation</b>, <b>numérique</b>.</p>
<div class="form">Taux de chômage = Chômeurs ÷ Population active × 100<br>Taux d'inflation = (IPC N − IPC N−1) ÷ IPC N−1 × 100<br>Indice = Valeur N ÷ Valeur de base × 100</div>
<div class="trap">Indice 112 = +12 % depuis la base. De 112 à 120 = +8 <b>points</b>, mais +7,1 % (8 ÷ 112).</div>`});

LESSONS.push({
id:'eco2', part:'eco', n:2, titre:"Création et répartition de la richesse",
pitch:"Facteurs de production, productivité, VA, PIB, répartition et redistribution.",
kw:"production marchande non marchande facteurs de production travail capital capital fixe immatériel substitution complémentarité croissance extensive intensive productivité par tête horaire progrès technique valeur ajoutée PIB doubles comptes PIB en valeur en volume nominal réel PIB par habitant limites du PIB IDH répartition primaire revenus du travail du capital mixtes dividendes intérêts loyers EBE taux de marge part des salaires SMIC redistribution prélèvements obligatoires impôts cotisations revenus de transfert prestations sociales assurance assistance verticale horizontale impôt progressif proportionnel dégressif TVA CSG revenu disponible",
cours:`
<h3>Production et facteurs</h3>
<p>Production <b>marchande</b> (vendue au moins à son coût) / <b>non marchande</b> (gratuite ou quasi, financée par les prélèvements). Facteurs : <b>travail</b> (quantité et qualité) et <b>capital</b> (capital fixe, immatériel, naturel). Ils peuvent se <b>substituer</b> (automatisation) ou être <b>complémentaires</b>.</p>
<p>Croissance <b>extensive</b> (plus de facteurs) / <b>intensive</b> (gains de productivité grâce au progrès technique, aux qualifications, à l'organisation).</p>
<div class="form">Productivité par tête = Production ÷ Nombre de travailleurs<br>Productivité horaire = Production ÷ Heures travaillées<br>Productivité du capital = Production ÷ Capital</div>
<h3>Mesurer : VA et PIB</h3>
<div class="form">VA = Production − Consommations intermédiaires<br>PIB = Σ VA + Impôts sur les produits − Subventions sur les produits<br>Taux de croissance = (PIB N − PIB N−1) ÷ PIB N−1 × 100<br>Croissance en volume ≈ croissance en valeur − inflation<br>PIB par habitant = PIB ÷ Population</div>
<p>On additionne des VA pour éviter les <b>doubles comptes</b>. PIB : richesse créée en un an par les agents <b>résidents</b>. PIB en <b>volume</b> (prix constants) = vraie croissance. Limites : pas d'économie souterraine, de travail domestique ni de bénévolat ; ne mesure ni bien-être, ni inégalités, ni dégâts environnementaux. Compléments : <b>IDH</b> (revenu, espérance de vie, éducation), empreinte écologique.</p>
<h3>Répartition primaire</h3>
<p>Revenus du <b>travail</b> (salaires), du <b>capital</b> (dividendes, intérêts, loyers), <b>mixtes</b> (indépendants). Partage salaires/profits : rapport de force, SMIC, productivité.</p>
<div class="form">Part des salaires = Rémunération des salariés ÷ VA × 100<br>Taux de marge = EBE ÷ VA × 100</div>
<h3>Redistribution</h3>
<p>Prélèvements obligatoires (impôts + cotisations) → revenus de transfert (prestations) + services publics. Logique d'<b>assurance</b> (on a cotisé) / d'<b>assistance</b> (sous conditions de ressources). Redistribution <b>verticale</b> (riches → pauvres) / <b>horizontale</b> (non-exposés → exposés au risque).</p>
<div class="def">Impôt <b>progressif</b> : taux qui augmente avec le revenu (IR). <b>Proportionnel</b> : même taux (CSG). <b>Dégressif</b> : pèse plus sur les bas revenus (TVA).</div>
<div class="form">Revenu disponible = Revenu primaire − Prélèvements obligatoires + Revenus de transfert</div>
<div class="trap">Changer de tranche d'IR ne fait payer le taux supérieur que sur la partie du revenu qui dépasse le seuil.</div>`});

LESSONS.push({
id:'eco3', part:'eco', n:3, titre:"Comment les ménages répartissent leur revenu",
pitch:"Pouvoir d'achat, consommation, épargne, crédit et surendettement.",
kw:"revenu disponible consommation épargne pouvoir d'achat inflation biens durables semi-durables non durables déterminants de la consommation revenu lois d'Engel prix élasticité facteurs sociologiques imitation distinction Veblen consommation ostentatoire publicité anticipations épargne de précaution propension moyenne à consommer PMC propension moyenne à épargner PME taux d'épargne coefficient budgétaire épargne financière non financière motifs placement transmission retraite crédit à la consommation surendettement TAEG délai de rétractation 14 jours paiement fractionné économie de l'usage",
cours:`
<h3>Revenu disponible et pouvoir d'achat</h3>
<div class="form">Revenu disponible = Consommation + Épargne<br>Évolution du pouvoir d'achat (%) ≈ Évolution du revenu (%) − Inflation (%)<br>Calcul exact : ((1 + r) ÷ (1 + i) − 1) × 100</div>
<h3>La consommation</h3>
<p>Biens <b>non durables</b>, <b>semi-durables</b>, <b>durables</b>. Déterminants : le <b>revenu</b> (<b>lois d'Engel</b> : quand le revenu augmente, la part de l'alimentation baisse, celle des loisirs/santé/culture monte) ; les <b>prix</b> (élasticité) ; les facteurs <b>sociologiques</b> (âge, PCS, mode, <b>imitation</b>, <b>distinction</b>, consommation <b>ostentatoire</b> de Veblen) ; techniques et commerciaux (innovation, pub, crédit, e-commerce) ; <b>anticipations</b> et confiance.</p>
<div class="form">PMC = Consommation ÷ Revenu disponible<br>PME = Épargne ÷ Revenu disponible<br>PMC + PME = 1<br>Taux d'épargne = Épargne ÷ RD × 100<br>Coefficient budgétaire = Dépense d'un poste ÷ Consommation totale × 100</div>
<p>Ménages modestes : PMC proche de 1 ; ménages aisés : PMC plus faible. Nouvelles tendances : numérique, <b>économie de l'usage</b> (abonnement plutôt que propriété), consommation collaborative, responsable.</p>
<h3>L'épargne</h3>
<p>Épargne <b>financière</b> (livrets, actions, assurance-vie) / <b>non financière</b> (immobilier). Motifs : <b>précaution</b>, <b>projet</b>, <b>placement</b>, <b>transmission</b>, <b>retraite</b>. Déterminants : revenu, taux d'intérêt, incertitude (forte hausse pendant le Covid), âge. L'épargne finance l'investissement, mais trop d'épargne freine la consommation.</p>
<h3>Crédit et surendettement</h3>
<p>Le <b>crédit à la consommation</b> permet d'acheter tout de suite mais coûte (intérêts). <b>Surendettement</b> : impossibilité de faire face à ses dettes → commission de la Banque de France. Protection : <b>TAEG</b> affiché, <b>14 jours</b> de rétractation, mention obligatoire. Le paiement en 3-4 fois est un crédit.</p>`});

LESSONS.push({
id:'eco4', part:'eco', n:4, titre:"Le financement de l'activité économique",
pitch:"Autofinancement, actions, obligations, crédit, effet de levier, monnaie, BCE.",
kw:"besoin de financement capacité de financement autofinancement capacité d'autofinancement CAF dividendes taux d'autofinancement financement direct marchés financiers action obligation coupon échéance marché primaire secondaire Bourse Euronext CAC 40 capital-investissement crowdfunding financement participatif financement indirect intermédié crédit bancaire court terme long terme crédit-bail garanties effet de levier effet de massue LBO monnaie unité de compte intermédiaire des échanges réserve de valeur monnaie fiduciaire scripturale électronique crypto-actifs MiCA euro numérique création monétaire les crédits font les dépôts BCE taux directeurs politique monétaire restrictive expansionniste stabilité des prix 2 %",
cours:`
<h3>Besoin et capacité de financement</h3>
<p><b>Capacité</b> : ressources &gt; dépenses (les ménages en général). <b>Besoin</b> : dépenses &gt; ressources (entreprises, administrations en déficit). Le financement fait circuler l'argent des uns vers les autres.</p>
<h3>Autofinancement (interne)</h3>
<div class="form">CAF ≈ Résultat net + Dotations aux amortissements<br>Autofinancement = CAF − Dividendes<br>Taux d'autofinancement = Autofinancement ÷ Investissement × 100</div>
<p>+ Indépendance, pas d'intérêts. − Souvent insuffisant, limite les dividendes, renonce parfois à l'effet de levier.</p>
<h3>Financement direct (marchés financiers)</h3>
<p><b>Action</b> : titre de <b>propriété</b> (dividende variable, droit de vote, revendable) ; pas de remboursement mais partage du pouvoir. <b>Obligation</b> : titre de <b>créance</b> (intérêts = coupon, remboursement à l'échéance, pas de vote). <b>Marché primaire</b> (émission, l'entreprise reçoit l'argent) / <b>secondaire</b> (revente = Bourse, liquidité). Aussi : capital-investissement, <b>crowdfunding</b>.</p>
<h3>Financement indirect (banques)</h3>
<p>Crédits court terme, moyen/long terme, crédit-bail ; garanties ; taux selon le risque.</p>
<div class="def"><b>Effet de levier</b> : si la rentabilité de l'investissement &gt; taux d'intérêt, l'endettement augmente la rentabilité des capitaux propres. Si elle tombe en dessous : <b>effet de massue</b>.</div>
<h3>La monnaie</h3>
<p>3 fonctions : <b>unité de compte</b>, <b>intermédiaire des échanges</b>, <b>réserve de valeur</b>. Formes : marchandise, <b>fiduciaire</b> (pièces, billets), <b>scripturale</b> (comptes, ≈ 85-90 % de la masse monétaire), électronique. Carte et chèque = instruments de paiement, pas de la monnaie. Crypto-actifs : pas de vraies monnaies (instables, peu acceptés, non garantis) ; encadrés par MiCA.</p>
<h3>Création monétaire et BCE</h3>
<p>Les banques créent la monnaie en accordant des crédits : « <b>les crédits font les dépôts</b> » ; le remboursement la détruit. La <b>BCE</b> (indépendante, Francfort) vise une inflation de <b>2 %</b> via ses <b>taux directeurs</b> : les monter = politique <b>restrictive</b> (crédit plus cher → moins de demande → moins d'inflation) ; les baisser = <b>expansionniste</b>.</p>`});

LESSONS.push({
id:'eco5', part:'eco', n:5, titre:"Les marchés sont-ils concurrentiels ?",
pitch:"Offre, demande, élasticité, CPP, structures de marché, stratégies et régulation.",
kw:"marché offre demande loi de la demande loi de l'offre prix d'équilibre excès d'offre excès de demande pénurie main invisible Adam Smith élasticité-prix élastique inélastique concurrence pure et parfaite atomicité homogénéité libre entrée transparence libre circulation des facteurs concurrence imparfaite monopole oligopole monopsone oligopsone monopole bilatéral concurrence monopolistique différenciation innovation Schumpeter monopole temporaire destruction créatrice barrières à l'entrée effet de réseau concentration entente coûts de changement fidélisation free-to-play abus de position dominante contrôle des concentrations Autorité de la concurrence Commission européenne DMA",
cours:`
<h3>Offre, demande, équilibre</h3>
<p><b>Marché</b> : rencontre de l'offre et de la demande → prix et quantité. <b>Loi de la demande</b> : prix ↑ → demande ↓ (courbe décroissante). <b>Loi de l'offre</b> : prix ↑ → offre ↑ (courbe croissante). <b>Prix d'équilibre</b> : quantité offerte = quantité demandée. Prix trop haut → excès d'offre → baisse ; prix trop bas → excès de demande (pénurie) → hausse. « Main invisible » (Adam Smith).</p>
<h3>Élasticité-prix</h3>
<div class="form">Élasticité-prix = Variation de la quantité demandée (%) ÷ Variation du prix (%)</div>
<p>|e| &gt; 1 : demande <b>élastique</b> (biens non essentiels, nombreux substituts). |e| &lt; 1 : <b>inélastique</b> (nécessité, pas de substitut, dépendance). Si la demande est inélastique, augmenter le prix augmente le CA.</p>
<h3>La concurrence pure et parfaite</h3>
<p>5 conditions : <b>atomicité</b>, <b>homogénéité</b>, <b>libre entrée et sortie</b>, <b>transparence</b>, <b>libre circulation des facteurs</b>. Modèle théorique de référence ; la réalité = concurrence imparfaite.</p>
<h3>Structures réelles</h3>
<p><b>Monopole</b> (1 vendeur, faiseur de prix ; naturel, légal ou acquis). <b>Oligopole</b> (quelques vendeurs interdépendants : le plus fréquent). <b>Monopsone</b> (1 acheteur). <b>Concurrence monopolistique</b> (beaucoup de vendeurs aux produits un peu différenciés). Aussi monopole bilatéral, contrarié, oligopsone.</p>
<h3>Échapper à la concurrence</h3>
<p><b>Différenciation</b> ; <b>innovation</b> (Schumpeter : <b>monopole temporaire</b>, <b>destruction créatrice</b> ; innovations de produit, procédé, organisation, débouchés, matières premières) ; <b>barrières à l'entrée</b> (naturelles, stratégiques, réglementaires) ; <b>effet de réseau</b> ; <b>concentration</b> ; <b>fidélisation</b> et coûts de changement ; <b>ententes</b> (illégales).</p>
<h3>Régulation</h3>
<p>Interdits : <b>ententes illicites</b> et <b>abus de position dominante</b> (être dominant n'est pas interdit, en abuser l'est). <b>Contrôle des concentrations</b>, encadrement des aides d'État. Autorités : <b>Autorité de la concurrence</b> (France), <b>Commission européenne</b> ; amendes jusqu'à 10 % du CA mondial ; <b>DMA</b> pour les grandes plateformes.</p>`});

p:[N("Calcule (arrondis au centime) :",[["Valeur acquise après 5 ans, intérêts simples (€)",2300],["Valeur acquise après 5 ans, intérêts composés (€)",2318.55,0.02],["Intérêts simples sur 9 mois (€)",45]])],
cor:"Simples : 2 000 × (1 + 0,03 × 5) = 2 300 €. Composés : 2 000 × 1,03⁵ ≈ 2 318,55 €. Sur 9 mois : 2 000 × 0,03 × 9/12 = 45 €."},
{t:'foot',b:1,ti:"Les maillots floqués du Real",xp:60,ctx:"Une boutique du Real Madrid vend 45 maillots par jour. Délai de livraison : 8 jours. Stock de sécurité : 150. Stock initial du trimestre : 900 ; stock final : 600 ; achats : 4 000 maillots.",
p:[N("Calcule :",[["Stock d'alerte",510],["Stock moyen",750],["Maillots vendus (achats + SI − SF)",4300],["Durée moyenne de stockage (jours, base 360)",62.8,0.3]]),
Q("Que risque la boutique si un joueur star part brusquement au mercato ?",["Une rupture de stock","Un stock invendable de maillots à son nom","Une baisse du délai de livraison","Rien"],1)],
cor:"Alerte = 150 + 45 × 8 = 510. Stock moyen = (900 + 600) ÷ 2 = 750. Vendus = 4 000 + 900 − 600 = 4 300. Durée = 750 ÷ 4 300 × 360 ≈ 62,8 jours. Départ d'un joueur = stock invendable."}
];

M.mgt1=[
{t:'foot',ti:"Qui est qui dans le foot ?",xp:50,ctx:"Autour d'un match, plusieurs organisations sont présentes.",
p:[C("Classe chaque organisation.",["Entreprise","Organisation publique","Association"],[["L'équipementier qui fabrique les maillots du FC Porto",0],["La mairie qui entretient le stade municipal",1],["Le club de foot amateur du quartier",2],["Un lycée public",1],["Un studio qui développe un jeu de foot",0],["Une association de supporters",2]]),
Q("Une association peut-elle faire des bénéfices ?",["Non, jamais","Oui, mais elle ne peut pas les distribuer à ses membres","Oui, et elle les distribue aux adhérents","Seulement si elle est publique"],1)],
cor:"Entreprise = but lucratif ; organisation publique = intérêt général ; association = non lucrative. Une association peut faire des bénéfices mais doit les réinvestir dans son projet."},
{t:'rap',ti:"Les objectifs de Tiakola",xp:50,ctx:"Le manager de Tiakola écrit plusieurs phrases dans son plan de carrière.",
p:[C("Classe chaque phrase.",["Finalité / but","Objectif SMART"],[["Faire mieux que l'an dernier",0],["Devenir plus connu à l'international",0],["Remplir l'Accor Arena le 14 juin 2027 avec 18 000 billets vendus",1],["Atteindre 25 % d'écoutes hors de France d'ici le 31/12/2027",1],["Faire de la musique qui rassemble",0]]),
H("Complète la méthode SMART.","S = [[Spécifique]], M = [[Mesurable]], A = Atteignable, R = [[Réaliste]], T = [[Temporellement défini|Temporel|Daté]].")],
cor:"Un objectif SMART est précis, chiffré et daté. « Faire mieux » ou « être plus connu » sont des buts trop vagues. SMART : Spécifique, Mesurable, Atteignable, Réaliste, Temporellement défini."},
{t:'jeu',ti:"Le coach League of Legends",xp:60,ctx:"Une structure e-sport a une équipe LoL : 2 rookies de 17 ans et 3 vétérans multi-titrés.",
p:[C("Quel style de management chaque attitude illustre-t-elle ?",["Directif","Persuasif","Participatif","Délégatif"],[["Il impose la draft aux rookies sans discuter",0],["Il décide seul mais explique longuement pourquoi",1],["Il construit la stratégie avec toute l'équipe",2],["Il laisse les vétérans organiser leurs scrims",3]]),
Q("Le directeur doit recruter un jungler en 48 h avec un petit budget et quelques vidéos. Selon Simon, il va…",["Trouver la solution optimale","Choisir une solution satisfaisante (rationalité limitée)","Attendre d'avoir toute l'information","Tirer au sort"],1)],
cor:"Directif = ordres ; persuasif = décide mais convainc ; participatif = associe l'équipe ; délégatif = autonomie. Un bon coach adapte son style (management situationnel). Rationalité limitée : info, temps et budget limités → solution satisfaisante."},
{t:'foot',b:1,ti:"Les 5 verbes de Fayol",xp:40,ctx:"Une semaine dans la vie d'un entraîneur.",
p:[C("Associe chaque action à une fonction de Fayol.",["Prévoir","Organiser","Commander","Coordonner","Contrôler"],[["Préparer le calendrier de la saison",0],["Répartir les rôles du staff",1],["Donner les consignes avant le match",2],["Faire travailler ensemble kinés et préparateurs",3],["Analyser les stats GPS après le match",4]])],
cor:"Prévoir = anticiper ; organiser = répartir ressources et tâches ; commander = donner des ordres ; coordonner = harmoniser ; contrôler = vérifier les résultats."},
{t:'jeu',b:1,ti:"Coordination en round",xp:40,ctx:"Une équipe Valorant se coordonne de plusieurs façons.",
p:[C("Quel mode de coordination ?",["Supervision directe","Standardisation","Ajustement mutuel"],[["Le coach impose la composition d'agents",0],["Les stratégies sont écrites dans un playbook",1],["Les joueurs s'adaptent en vocal pendant le round",2],["L'IGL donne un ordre de rotation",0]])],
cor:"Supervision directe = un chef ordonne ; standardisation = procédures écrites ; ajustement mutuel = on se parle et on s'adapte."}
];

M.mgt2=[
{t:'foot',ti:"Le SWOT du FC Porto",xp:70,ctx:"Éléments sur le FC Porto (analyse simplifiée).",
p:[C("Range chaque élément dans la matrice SWOT.",["Force","Faiblesse","Opportunité","Menace"],[["Formation et recrutement de jeunes talents reconnus",0],["Estádio do Dragão moderne",0],["Dépendance aux ventes de joueurs",1],["Ligue des champions élargie : plus de matchs et de primes",2],["Fans en croissance en Amérique du Sud",2],["Droits TV du championnat portugais faibles",3],["Clubs anglais et saoudiens qui recrutent ses talents très tôt",3]]),
Q("Quelle piste s'appuie sur une force pour saisir une opportunité ?",["Vendre moins de joueurs","Miser sur son scouting pour performer en Ligue des champions","Baisser le prix des billets","Quitter le championnat"],1)],
cor:"Interne : forces (formation, stade) / faiblesse (dépendance aux ventes). Externe : opportunités (LDC élargie, fans sud-américains) / menaces (droits TV faibles, concurrence de clubs riches). Le club contrôle l'interne, il subit l'externe."},
{t:'jeu',ti:"PESTEL de GTA VI",xp:70,ctx:"Tu es analyste pour l'éditeur de GTA VI, vendu environ 80 €.",
p:[T("Pour chaque élément, choisis la dimension PESTEL et dis si c'est une opportunité ou une menace.",["Élément","Dimension","O / M"],[["Inflation et baisse du pouvoir d'achat",{o:["P","E","S","T","É","L"],a:1},{o:["Opportunité","Menace"],a:1}],["Twitch et YouTube : des millions de vues gratuites",{o:["P","E","S","T","É","L"],a:2},{o:["Opportunité","Menace"],a:0}],["Consoles plus puissantes et cloud gaming",{o:["P","E","S","T","É","L"],a:3},{o:["Opportunité","Menace"],a:0}],["Régulation européenne des microtransactions",{o:["P","E","S","T","É","L"],a:5},{o:["Opportunité","Menace"],a:1}],["Censure des jeux violents dans certains pays",{o:["P","E","S","T","É","L"],a:0},{o:["Opportunité","Menace"],a:1}],["Critiques sur la consommation d'énergie des serveurs",{o:["P","E","S","T","É","L"],a:4},{o:["Opportunité","Menace"],a:1}]])],
cor:"Inflation = Économique, menace. Streaming = Socioculturel, opportunité. Cloud/consoles = Technologique, opportunité. Régulation = Légal, menace. Censure = Politique, menace. Énergie = Écologique, menace."},
{t:'rap',ti:"Werenoi et les 5 forces",xp:60,ctx:"Werenoi est l'un des artistes les plus streamés en France. Analyse le marché des labels de rap.",
p:[C("Associe chaque constat à la force de Porter.",["Rivalité","Nouveaux entrants","Substituts","Pouvoir des clients","Pouvoir des fournisseurs"],[["Majors et indés se battent pour signer les artistes qui buzzent",0],["N'importe qui peut sortir un son via un distributeur numérique",1],["Podcasts et vidéos courtes captent le temps d'écoute",2],["Les plateformes de streaming négocient la rémunération",3],["Un artiste star exige de garder ses masters",4]]),
Q("Si les 5 forces sont fortes, le secteur est…",["Très rentable","Peu rentable","Sans concurrence","Monopolistique"],1)],
cor:"Rivalité forte, entrants nombreux, substituts, clients (plateformes) et fournisseurs (artistes stars) puissants : secteur difficile, rentabilité sous pression."},
{t:'foot',b:1,ti:"Les 3 niveaux de décision",xp:40,ctx:"Décisions prises au Real Madrid (exemples simplifiés).",
p:[C("Classe chaque décision.",["Stratégique","Tactique","Opérationnelle"],[["Rénover entièrement le Bernabéu",0],["Choisir les joueurs à recruter au mercato",1],["Fixer l'horaire du bus pour le match",2],["Miser sur l'international pour 10 ans",0],["Fixer le prix des abonnements",1],["Préparer la séance d'entraînement de mardi",2]])],
cor:"Stratégique = long terme, direction générale ; tactique = moyen terme, mise en œuvre ; opérationnelle = court terme, quotidien. Attention : la « tactique » au foot n'a pas le même sens."},
{t:'jeu',b:1,ti:"Stratégie qui émerge",xp:40,ctx:"Un petit studio sort un jeu de cartes sans grande ambition. Un streamer le découvre, le jeu explose, et le studio réorganise toute sa feuille de route autour de ce succès.",
p:[Q("C'est une stratégie…",["Délibérée","Émergente","Opérationnelle","Tactique"],1),
Q("Une compétence distinctive est…",["Ce que l'organisation fait mieux que les autres, difficile à copier","Une opportunité du marché","Un diplôme","Une menace"],0)],
cor:"Stratégie émergente : elle se construit à partir d'un succès imprévu. Compétence distinctive : savoir-faire supérieur, difficile à imiter, source d'avantage concurrentiel."}
];

M.mgt3=[
{t:'foot',ti:"Les DAS du Real Madrid",xp:60,ctx:"Le Real Madrid exploite le sportif, le Bernabéu rénové (concerts, visites), le merchandising, une plateforme de contenus et une section basket.",
p:[Q("Un DAS, c'est…",["Un service RH","Un sous-ensemble d'activités avec ses propres clients, concurrents et facteurs clés de succès","Le budget du club","Une filiale à l'étranger"],1),
C("Pour chaque concurrent, quel DAS est concerné ?",["Sportif","Événementiel / stade","Merchandising","Contenus"],[["Les autres grands clubs européens",0],["Les autres salles de concert de Madrid",1],["Les marques de vêtements de sport",2],["Les plateformes vidéo",3]]),
Q("Ces choix traduisent une stratégie de…",["Spécialisation","Diversification liée (concentrique)","Diversification non liée","Externalisation"],1)],
cor:"Chaque DAS a ses clients, concurrents et FCS. Toutes les activités s'appuient sur la marque et les fans : diversification liée, qui répartit le risque lié aux résultats sportifs."},
{t:'jeu',ti:"Trois studios, trois stratégies",xp:60,ctx:"Studio A : petits jeux mobiles gratuits chaque mois, même moteur, financés par la pub. Studio B : un monde ouvert ultra détaillé en 7 ans, vendu au prix fort. Studio C : uniquement des simulateurs de camions pour une communauté de passionnés.",
p:[C("Associe chaque studio à sa stratégie générique.",["Domination par les coûts","Différenciation","Focalisation"],[["Studio A",0],["Studio B",1],["Studio C",2]]),
C("Associe chaque risque à la stratégie concernée.",["Domination par les coûts","Différenciation","Focalisation"],[["Guerre des prix, image bas de gamme",0],["Les clients refusent de payer plus cher",1],["Le marché visé est trop petit",2]])],
cor:"A = coûts (économies d'échelle, effet d'expérience). B = différenciation (qualité unique, prix élevé). C = focalisation (niche). Risques : guerre des prix ; refus de payer la différence ; niche trop petite ou attaquée."},
{t:'rap',ti:"Orelsan fait du business",xp:70,ctx:"Imaginons qu'un artiste comme Orelsan développe plusieurs activités en plus de sa musique.",
p:[C("Identifie la stratégie ou la modalité de croissance.",["Diversification liée","Intégration verticale amont","Croissance externe","Croissance interne","Externalisation"],[["Il lance une marque de vêtements vendue à ses fans",0],["Il contrôle désormais le studio où il enregistre",1],["Il rachète un petit studio indépendant",2],["Il crée lui-même sa société de production",3],["Il confie la gestion de sa boutique en ligne à un prestataire",4]]),
R("Donne un avantage et une limite de la diversification pour un artiste.",[["Avantage : réduire / répartir le risque","risque|repart|securi"],["Avantage : monétiser la notoriété, nouveaux revenus","revenu|notoriete|argent|monetis|gagner"],["Limite : dispersion / marchés mal maîtrisés / coûts","dispers|maitris|cout|image|echec"]])],
cor:"Marque de vêtements = diversification liée. Contrôler le studio = intégration verticale amont. Racheter = croissance externe ; créer soi-même = croissance interne ; confier à un prestataire = externalisation. Diversifier réduit le risque et monétise la notoriété, mais disperse et fait entrer sur des marchés mal maîtrisés."},
{t:'foot',b:1,ti:"Grandir : comment ?",xp:40,ctx:"Différentes façons dont des clubs se développent.",
p:[C("Classe chaque situation.",["Croissance interne","Croissance externe","Alliance / partenariat","Internationalisation"],[["Le club agrandit son centre de formation",0],["Un groupe rachète un deuxième club à l'étranger",1],["Un contrat avec un équipementier qui fournit les maillots",2],["Une tournée de pré-saison aux États-Unis",3]]),
Q("Principal inconvénient de la croissance interne ?",["Elle est lente","Elle est interdite","Elle coûte toujours plus cher","Elle crée des conflits de culture"],0)],
cor:"Interne = par ses propres investissements (lent). Externe = rachat. Alliance = coopération entre entreprises indépendantes. Internationalisation = conquérir des fans à l'étranger."},
{t:'jeu',b:1,ti:"La mairie et le complexe e-sport",xp:40,ctx:"Une ville construit un complexe e-sport municipal et hésite sur son mode de gestion.",
p:[C("Associe chaque option à son nom.",["Régie","Délégation de service public","Partenariat public-privé"],[["Les agents municipaux gèrent tout",0],["Une entreprise privée exploite le complexe pour la ville",1],["Une entreprise construit et exploite, la ville paie un loyer pendant 25 ans",2]]),
Q("Quel principe du service public impose d'ouvrir le complexe sans interruption prévue ?",["Égalité","Continuité","Rentabilité","Spécialité"],1)],
cor:"Régie = gestion directe ; délégation = confiée au privé ; PPP = construction et exploitation privées contre un loyer. Principes : égalité, continuité, adaptabilité."}
];

M.droit1=[
{t:'jeu',ti:"Le règlement du tournoi Valorant",xp:50,ctx:"Le règlement d'un tournoi Valorant amateur interdit les logiciels de triche (sanction : disqualification). Par ailleurs, la loi punit la fraude informatique de prison et d'amende.",
p:[T("Coche les caractères présents.",["Caractère","Règlement du tournoi","Loi sur la fraude"],[["Vise toute la société (générale)",{o:["Oui","Non"],a:1},{o:["Oui","Non"],a:0}],["Obligatoire pour ceux qu'elle vise",{o:["Oui","Non"],a:0},{o:["Oui","Non"],a:0}],["Sanction prononcée au nom de l'État (coercitive)",{o:["Oui","Non"],a:1},{o:["Oui","Non"],a:0}]]),
Q("Le règlement du tournoi est-il une règle de droit ?",["Oui, car il est obligatoire","Non, il émane d'un organisateur privé et n'est pas sanctionné par l'État","Oui, car il y a une sanction","Non, car il est écrit"],1)],
cor:"Le règlement ne vise que les participants et sa sanction est prononcée par l'organisateur : ce n'est pas une règle de droit. La loi sur la fraude est générale, obligatoire, coercitive (tribunal) et permanente."},
{t:'foot',ti:"Le contrat d'un joueur et la hiérarchie des normes",xp:60,ctx:"Un joueur français signe dans un club. Plusieurs textes le concernent.",
p:[C("Classe du plus haut (1) au plus bas (5) dans la pyramide.",["1","2","3","4","5"],[["Traités de l'Union européenne (libre circulation)",0],["Code du travail (loi)",1],["Décret sur la protection sociale",2],["Convention collective du football",3],["Contrat de travail du joueur",4]]),
Q("Une clause du contrat contredit une loi impérative. Conséquence ?",["La clause s'applique car les deux parties l'ont signée","La clause est nulle, on ne peut pas déroger à une règle d'ordre public","La loi est annulée","Le juge choisit librement"],1)],
cor:"Traités > loi > règlements (décrets) > conventions collectives > contrat. Une clause contraire à une règle impérative (d'ordre public) est nulle, même si les parties sont d'accord."},
{t:'rap',ti:"Les branches du droit autour de Damso",xp:50,ctx:"Situations imaginées autour d'un artiste comme Damso.",
p:[C("Quelle branche du droit ?",["Droit fiscal","Droit du travail","Droit de la consommation","Droit administratif","Droit pénal"],[["Il paie l'impôt sur ses revenus de streaming",0],["Il embauche une choriste pour sa tournée",1],["Un fan conteste le remboursement d'un billet",2],["La préfecture interdit un concert pour sécurité",3],["Un revendeur de faux billets est poursuivi",4]]),
Q("Lesquelles relèvent du droit public ? (plusieurs réponses)",["Droit fiscal","Droit du travail","Droit administratif","Droit de la consommation"],[0,2])],
cor:"Fiscal et administratif = droit public. Travail et consommation = droit privé. Pénal = rattaché au privé avec une forte dimension publique."},
{t:'jeu',b:1,ti:"Le RGPD et la loi",xp:40,ctx:"Le RGPD encadre les données des joueurs dans toute l'Union européenne.",
p:[Q("Le RGPD est un règlement européen. Il…",["S'applique directement dans tous les pays de l'UE","Doit être transposé par chaque pays","N'a pas de force obligatoire","Est inférieur aux décrets"],0),
H("Complète le parcours d'une loi.","Un texte venant du gouvernement s'appelle un [[projet]] de loi. Il fait la [[navette]] entre l'Assemblée nationale et le Sénat, puis il est [[promulgué|promulgue|promulguee]] par le Président et publié au [[Journal officiel|JO]].")],
cor:"Règlement européen = directement applicable ; directive = à transposer. Projet (gouvernement) / proposition (parlementaires) → navette → promulgation → Journal officiel."},
{t:'foot',b:1,ti:"D'où vient la règle ?",xp:40,ctx:"Le droit a plusieurs sources.",
p:[C("Identifie la source.",["Loi","Jurisprudence","Coutume","Doctrine"],[["Texte voté par le Parlement",0],["Une décision de la Cour de justice qui change les règles des transferts",1],["Un usage répété et jugé obligatoire",2],["Un article de professeur de droit sur les contrats des joueurs",3]]),
Q("Quel organe vérifie que les lois respectent la Constitution ?",["Le Conseil d'État","Le Conseil constitutionnel","La Cour de cassation","Le Sénat"],1)],
cor:"Loi = Parlement ; jurisprudence = décisions des juges ; coutume = usage obligatoire ; doctrine = écrits des juristes (non obligatoire). Conseil constitutionnel = contrôle des lois (QPC depuis 2010)."}
];

M.droit2=[
{t:'rap',ti:"La prod vendue par DM",xp:80,ctx:"Kaïz, beatmaker, vend une instru à MC Néon (rappeur fictif) pour 4 200 €. Tout se fait en messages privés : « vas-y 4,2K pour l'instru, je te paye à la sortie ». Le morceau cartonne, MC Néon ne paie pas.",
p:[Q("La vente est…",["Un fait juridique","Un acte juridique","Une infraction pénale","Une coutume"],1),
Q("Comment se prouve un acte juridique de plus de 1 500 € ?",["Par tout moyen","En principe par écrit","Uniquement par témoignage","Il n'a pas à être prouvé"],1),
Q("Juridiction compétente (litige civil de 4 200 € entre particuliers) ?",["Tribunal de commerce","Conseil de prud'hommes","Tribunal judiciaire","Tribunal correctionnel"],2),
R("Rédige la solution avec le raisonnement juridique (faits, problème, règles, application, solution).",[["Qualification : acte juridique / contrat","acte juridique|contrat"],["Seuil de 1 500 € et exigence d'un écrit","1 ?500|ecrit"],["Les messages = commencement de preuve par écrit / écrit électronique","commencement de preuve|ecrit electronique|messages"],["Charge de la preuve sur le demandeur","charge de la preuve|demandeur|1353"],["Application avec « en l'espèce »","en l.espece|or,|or "],["Solution claire","par consequent|en consequence|donc"]])],
cor:"Faits : contrat de cession/vente de 4 200 € non payé. Problème : comment prouver un acte juridique > 1 500 € sans écrit signé ? Règles : la charge de la preuve pèse sur le demandeur (art. 1353) ; écrit exigé au-delà de 1 500 €, mais un commencement de preuve par écrit complété par d'autres éléments est admis ; l'écrit électronique vaut s'il identifie l'auteur. En l'espèce, les DM viennent de MC Néon. Par conséquent, Kaïz peut agir devant le tribunal judiciaire, après une tentative de conciliation."},
{t:'foot',ti:"Le kiné licencié",xp:60,ctx:"Cas fictif en France : un kiné salarié d'un club de Ligue 2 est licencié. Il conteste, perd en première instance, fait appel et gagne. Le club estime que la cour d'appel a mal interprété la notion de « faute grave ».",
p:[Q("Juridiction de première instance ?",["Tribunal judiciaire","Conseil de prud'hommes","Tribunal de commerce","Cour d'assises"],1),
Q("La cour d'appel…",["Rejuge l'affaire en fait et en droit","Vérifie seulement le droit","Ne peut que confirmer","Est un tribunal pénal"],0),
H("Complète.","Le club forme un [[pourvoi]] devant la Cour de [[cassation]], qui est juge du [[droit]] et non des faits. Si elle donne tort à la cour d'appel, elle [[casse]] et annule, puis renvoie devant une autre cour d'appel.")],
cor:"Salarié vs employeur sur le contrat de travail = prud'hommes. Appel = rejugement complet (arrêt). Pourvoi en cassation : la Cour de cassation juge le droit ; elle rejette le pourvoi ou casse et renvoie."},
{t:'jeu',ti:"Litige de transfert e-sport",xp:50,ctx:"Deux structures e-sport (française et coréenne) se disputent le transfert d'un joueur League of Legends.",
p:[C("Quel mode de règlement ?",["Négociation","Conciliation","Médiation","Arbitrage"],[["Les deux directeurs trouvent seuls un accord et le signent",0],["Un conciliateur de justice bénévole propose une solution",1],["Un tiers neutre les aide à renouer le dialogue",2],["Un arbitre spécialisé rend une sentence qui s'impose",3]]),
Q("Pourquoi préférer l'arbitrage pour un litige international ?",["C'est toujours gratuit","Rapide, confidentiel, arbitres spécialisés","C'est obligatoire en droit français","Il n'y a pas de décision"],1)],
cor:"Négociation = accord direct (transaction si concessions écrites). Conciliation = conciliateur qui propose. Médiation = rétablir le dialogue. Arbitrage = sentence qui s'impose ; rapide, confidentiel, spécialisé, mais coûteux (comme le TAS)."},
{t:'foot',b:1,ti:"Supporters devant le juge",xp:50,ctx:"Infractions commises autour d'un stade (cas fictifs).",
p:[T("Complète le tableau.",["Infraction","Catégorie","Juridiction"],[["Stationnement interdit devant le stade",{o:["Contravention","Délit","Crime"],a:0},{o:["Tribunal de police","Tribunal correctionnel","Cour d'assises"],a:0}],["Fumigène allumé en tribune",{o:["Contravention","Délit","Crime"],a:1},{o:["Tribunal de police","Tribunal correctionnel","Cour d'assises"],a:1}],["Vol de maillots à la boutique",{o:["Contravention","Délit","Crime"],a:1},{o:["Tribunal de police","Tribunal correctionnel","Cour d'assises"],a:1}]])],
cor:"Contravention → tribunal de police. Délit (vol, usage d'engins pyrotechniques en stade) → tribunal correctionnel. Crime → cour d'assises."},
{t:'rap',b:1,ti:"Un procès équitable",xp:40,ctx:"Le procès d'un producteur (cas fictif) doit respecter les principes du procès équitable.",
p:[C("Quel principe est en jeu ?",["Contradictoire","Impartialité du juge","Publicité des débats","Présomption d'innocence"],[["Chaque partie peut répondre aux preuves de l'autre",0],["Le juge ne doit pas être fan de l'une des parties",1],["En principe, tout le monde peut assister à l'audience",2],["Un média ne peut pas le présenter comme coupable avant le jugement",3]])],

M.droit3=[
{t:'jeu',ti:"Les V-Bucks de Lucas, 14 ans",xp:80,ctx:"Lucas, 14 ans, achète seul 9,99 € de V-Bucks avec sa carte prépayée. Le mois suivant, il enregistre la carte de son père et dépense 850 € en packs.",
p:[Q("Un mineur non émancipé a…",["La capacité de jouissance et d'exercice","La capacité de jouissance mais pas, en principe, d'exercice","Aucune capacité","Seulement la capacité d'exercice"],1),
C("Chaque achat est-il valable ?",["Valable (acte de la vie courante)","Annulable"],[["9,99 € avec sa carte prépayée",0],["850 € avec la carte de son père",1]]),
R("Rédige le cas pratique (faits qualifiés, problème, règles, application, solution).",[["Mineur non émancipé","mineur"],["Capacité d'exercice / représentation par les parents","capacite d.exercice|represent|autorite parentale"],["Actes de la vie courante","vie courante"],["Application : 850 € dépasse ce qui est courant","850|depasse|important|eleve"],["Solution : annulation possible demandée par les parents","annul|nullit"]])],
cor:"Lucas, mineur non émancipé, a la capacité de jouissance mais pas d'exercice : ses parents le représentent. Il peut faire seul les actes de la vie courante. 9,99 € avec sa carte = courant → valable. 850 € avec la carte de son père dépasse largement → les parents peuvent demander l'annulation."},
{t:'rap',ti:"Un duo de rap en SAS",xp:70,ctx:"Deux rappeurs utilisent un nom de scène et ont créé une SAS pour leur label et leur merch. Un fournisseur de t-shirts impayé par la SAS veut saisir l'appartement personnel d'un des deux.",
p:[Q("Le nom de scène…",["A les mêmes caractères que le nom de famille","Peut être choisi, changé, et déposé comme marque","Est inscrit sur la carte d'identité","Est interdit"],1),
Q("La SAS acquiert la personnalité juridique…",["À la signature des statuts","À son immatriculation au RCS","Au premier album","À la déclaration en préfecture"],1),
Q("Le fournisseur peut-il saisir l'appartement ?",["Oui, toujours","En principe non : la SAS a un patrimoine distinct","Oui, si l'album marche","Seulement en cas d'aveu"],1)],
cor:"Pseudonyme ≠ nom (on peut le changer, le déposer à l'INPI). La SAS naît à l'immatriculation au RCS ; personne morale avec patrimoine distinct ; associés responsables en principe à hauteur de leurs apports. Sauf faute personnelle ou caution, pas de saisie de l'appartement."},
{t:'foot',ti:"Un jeune de la Fábrica signe pro",xp:60,ctx:"Un joueur de 16 ans du centre de formation du Real Madrid va signer son premier contrat. Son agent dit qu'il peut signer seul. Imagine que le droit français s'applique.",
p:[Q("L'agent a-t-il raison ?",["Oui, il a un salaire","Non, ce n'est pas un acte de la vie courante : ses représentants légaux doivent signer avec lui","Oui, dès 16 ans on est majeur","Non, un mineur ne peut jamais travailler"],1),
H("Complète.","À partir de [[16]] ans, un mineur peut être [[émancipé|emancipe]] par décision du [[juge]], à la demande de ses parents. Il devient alors capable comme un majeur pour la plupart des actes.")],
cor:"Le mineur a la capacité de jouissance mais pas d'exercice. Un contrat pro n'est pas un acte de la vie courante. Solution : émancipation judiciaire dès 16 ans."},
{t:'rap',b:1,ti:"Protéger un majeur",xp:40,ctx:"L'oncle d'un producteur a des difficultés à gérer seul ses affaires (situations fictives).",
p:[C("Quel régime ?",["Sauvegarde de justice","Curatelle","Tutelle"],[["Mesure temporaire, il garde sa capacité",0],["Il agit lui-même mais assisté pour les actes importants",1],["Un représentant agit à sa place pour la plupart des actes",2]]),
Q("Quel principe impose une mesure adaptée au degré d'altération ?",["Spécialité","Proportionnalité","Publicité","Contradictoire"],1)],
cor:"Sauvegarde (temporaire) < curatelle (assistance) < tutelle (représentation). Principes : nécessité, subsidiarité, proportionnalité."},
{t:'jeu',b:1,ti:"Sujet ou objet de droit ?",xp:40,ctx:"Qui a la personnalité juridique ?",
p:[C("Classe.",["Personne physique","Personne morale de droit public","Personne morale de droit privé","Pas de personnalité juridique"],[["Un streamer de 22 ans",0],["La commune de Marseille",1],["Une association de joueurs déclarée en préfecture",2],["Le chien mascotte du club",3],["Un personnage non-joueur (PNJ) piloté par une IA",3],["Un studio de jeux en SARL",2]])],
cor:"Humains = personnes physiques. Communes, État = personnes morales de droit public. Sociétés, associations déclarées = droit privé. Animaux (êtres sensibles) et IA = objets de droit."}
];

M.droit4=[
{t:'rap',ti:"Le sample de Lazer",xp:80,ctx:"Le producteur Lazer reprend 4 secondes reconnaissables d'un morceau des années 80 pour une instru qu'il vend. Aucune autorisation. Le compositeur original est décédé en 1990.",
p:[N("Calcule :",[["Année jusqu'à laquelle durent les droits patrimoniaux",2060]]),
Q("Quels droits sont en jeu ? (plusieurs réponses)",["Droit d'auteur du compositeur","Droits voisins du producteur de l'enregistrement","Brevet","Droit de propriété sur un immeuble"],[0,1]),
Q("Utiliser le sample sans autorisation, c'est…",["Une courte citation autorisée","Une contrefaçon","Une coutume du rap","Une parodie"],1)],
cor:"Vie de l'auteur + 70 ans : 1990 + 70 = 2060, l'œuvre est protégée. Sont en jeu le droit d'auteur (composition) et les droits voisins (master). Sans autorisation = contrefaçon (dommages et intérêts, jusqu'à 3 ans de prison et 300 000 €). Il fallait « clearer » le sample."},
{t:'jeu',ti:"Ton jeu, ta propriété ?",xp:70,ctx:"Tom a EA SPORTS FC en boîte (disque), l'édition suivante en dématérialisé, et 40 € de packs Ultimate Team.",
p:[T("Quels attributs a-t-il ?",["Achat","Usus","Fructus","Abusus"],[["Disque",{o:["Oui","Non"],a:0},{o:["Oui","Non"],a:0},{o:["Oui","Non"],a:0}],["Jeu dématérialisé (licence)",{o:["Oui","Non"],a:0},{o:["Oui","Non"],a:1},{o:["Oui","Non"],a:1}],["Joueurs Ultimate Team",{o:["Oui","Non"],a:0},{o:["Oui","Non"],a:1},{o:["Oui","Non"],a:1}]]),
Q("Avec le dématérialisé, Tom achète en général…",["La propriété du jeu","Une licence d'utilisation (droit personnel d'usage)","Le brevet du jeu","Les droits d'auteur"],1)],
cor:"Disque : pleine propriété (usus, fructus, abusus). Dématérialisé et objets virtuels : licence d'utilisation, usage seulement ; pas de revente ni de revenus ; l'éditeur reste propriétaire."},
{t:'foot',ti:"Photos d'un joueur du Real",xp:70,ctx:"Cas fictif : un paparazzi photographie un joueur du Real Madrid en famille sur une plage privée et vend les photos. Le même week-end, un journal publie une photo de lui célébrant un but au Bernabéu.",
p:[C("Le joueur peut-il s'opposer à la publication ?",["Oui","Non"],[["Photo à la plage privée",0],["Photo du but au stade",1]]),
Q("Sur quel article se fonde-t-il pour la plage ?",["Article 544 (propriété)","Article 9 du Code civil (vie privée)","Article 1353 (preuve)","Article 2276"],1),
Q("Les droits de la personnalité sont…",["Cessibles et saisissables","Incessibles, intransmissibles, insaisissables, imprescriptibles","Limités à 70 ans","Réservés aux sportifs"],1)],
cor:"Plage privée : atteinte à la vie privée et au droit à l'image (art. 9), retrait et dommages et intérêts possibles. Photo du but : personne publique dans son activité, actualité → pas d'opposition (hors exploitation commerciale)."},
{t:'jeu',b:1,ti:"Protéger un jeu",xp:50,ctx:"Un studio protège son nouveau jeu.",
p:[C("Quel outil protège quoi ?",["Droit d'auteur","Brevet","Marque","Dessins et modèles"],[["Le code et la musique du jeu",0],["Une nouvelle manette avec un capteur inédit",1],["Le nom et le logo du jeu",2],["La forme design de la manette",3]]),
N("Durée de protection (en années) :",[["Brevet (maximum)",20],["Marque (avant renouvellement)",10]]),
Q("L'idée d'un battle royale est-elle protégeable ?",["Oui, par le droit d'auteur","Non, une idée seule n'est pas protégée","Oui, par une marque","Oui, 20 ans"],1)],
cor:"Œuvres (code, musique) = droit d'auteur sans dépôt. Invention technique = brevet (20 ans). Nom/logo = marque (10 ans renouvelables). Apparence = dessins et modèles. Une idée seule n'est pas protégée."},
{t:'foot',b:1,ti:"Meuble ou immeuble ?",xp:40,ctx:"Les biens d'un club.",
p:[C("Classe.",["Immeuble par nature","Immeuble par destination","Meuble"],[["Le terrain du centre d'entraînement",0],["Le bâtiment du stade",0],["Les sièges scellés dans les tribunes",1],["Un ballon",2],["Le bus du club",2]]),
Q("« En fait de meubles, la possession vaut titre » est l'article…",["544","2276","9","1353"],1)],
cor:"Sol et bâtiments = immeubles par nature ; objets fixés durablement = immeubles par destination ; ballon, bus = meubles. Art. 2276 : le possesseur de bonne foi d'un meuble est présumé propriétaire."}
];

M.eco1=[
{t:'jeu',ti:"Le dilemme du samedi",xp:50,ctx:"Yanis a 80 € et un samedi libre. Option 1 : une extension de jeu + soirée Valorant avec ses potes. Option 2 : le match du FC Porto à Lille (billet 45 € + covoiturage 35 €). Option 3 : 8 h d'extra au fast-food à 11,88 € net de l'heure.",
p:[N("Calcule :",[["Ce que rapporterait l'option 3 (€)",95.04]]),
Q("Le coût d'opportunité d'un choix, c'est…",["Le prix payé","La valeur de la meilleure option à laquelle on renonce","La somme de toutes les options","Le bénéfice"],1),
Q("Le coût d'opportunité est-il seulement de l'argent ?",["Oui","Non : temps, plaisir, relations comptent aussi"],1)],
cor:"8 × 11,88 = 95,04 €. Coût d'opportunité = meilleure option sacrifiée (gains, soirée avec ses amis…). Il inclut temps, plaisir, relations. Lien avec la rareté."},
{t:'foot',ti:"Le circuit autour du FC Porto",xp:60,ctx:"Le FC Porto vend billets et maillots, paie ses salariés, verse impôts et cotisations, emprunte à une banque, vend des joueurs en Angleterre, est soutenu par des associations de supporters.",
p:[C("Quel agent économique ?",["Ménages","Entreprises","Administrations publiques","Institutions financières","ISBLSM","Reste du monde"],[["Les supporters qui achètent des billets",0],["Le club",1],["L'État portugais",2],["La banque qui prête",3],["L'association de supporters",4],["Le club anglais qui achète un joueur",5]]),
C("Flux réel ou monétaire ?",["Flux réel","Flux monétaire"],[["Le travail des joueurs",0],["Les salaires versés",1],["Les maillots vendus",0],["Les impôts payés",1]])],
cor:"Ménages, entreprises, administrations, institutions financières, ISBLSM, reste du monde. Flux réels = biens, services, travail ; flux monétaires = argent en contrepartie."},
{t:'rap',ti:"L'inflation des places de concert",xp:60,ctx:"Indice du prix moyen d'une place de concert de rap (base 100 en 2020, chiffres inventés). Prix moyen en 2020 : 45 €.",
p:[G('line',["2020","2021","2022","2023","2024","2025"],[["Indice",[100,104,110,118,123,127]]],"indice","Prix des places (base 100 en 2020)"),
N("Calcule :",[["Prix moyen en 2025 (€)",57.15],["Hausse 2020 → 2025 (%)",27],["Écart 2023 → 2025 (points)",9],["Hausse 2023 → 2025 (%)",7.63,0.1]]),
Q("Entre quelles années la hausse est-elle la plus forte ?",["2020-2021","2022-2023","2023-2024","2024-2025"],1)],
cor:"Prix 2025 = 45 × 1,27 = 57,15 €. +27 % depuis 2020. 2023→2025 : +9 points mais (127 − 118) ÷ 118 ≈ +7,6 %. Plus forte hausse : 2022-2023 (+8 points)."},
{t:'foot',b:1,ti:"Chômage et inflation",xp:50,ctx:"Données d'un pays fictif : 31 millions d'actifs dont 2,325 millions de chômeurs. IPC : 118 en N−1, 121,54 en N.",
p:[G('bar',["N−3","N−2","N−1","N"],[["IPC",[104,110,118,121.54]]],"indice","Indice des prix à la consommation"),
N("Calcule :",[["Taux de chômage (%)",7.5],["Taux d'inflation N (%)",3]]),
Q("L'inflation, c'est…",["La hausse d'un seul prix","La hausse générale et durable des prix","La baisse du chômage","La hausse du PIB"],1)],
cor:"Chômage = 2,325 ÷ 31 = 7,5 %. Inflation = (121,54 − 118) ÷ 118 = 3 %. Inflation = hausse générale et durable des prix (IPC, INSEE)."},
{t:'jeu',b:1,ti:"Les grands enjeux",xp:40,ctx:"Des titres d'actualité (inventés).",
p:[C("Quel enjeu économique ?",["Croissance","Inflation","Développement durable","Mondialisation","Numérique"],[["« Le PIB progresse de 1,2 % »",0],["« Les prix des abonnements de jeux explosent »",1],["« Les serveurs de jeux doivent réduire leur empreinte carbone »",2],["« Une console fabriquée avec des pièces de 12 pays »",3],["« Les plateformes de streaming dominent la musique »",4]])],
cor:"Croissance = hausse du PIB ; inflation = hausse générale des prix ; développement durable = 3 piliers ; mondialisation = échanges internationaux ; numérique = plateformes, données."}
];

M.eco2=[
{t:'foot',ti:"La VA d'un ballon de Liga",xp:70,ctx:"Chaîne de production simplifiée d'un ballon officiel (prix HT, chiffres inventés).",
p:[T("Complète la valeur ajoutée de chaque étape.",["Étape","Prix de vente","Consommations intermédiaires","Valeur ajoutée"],[["Fournisseur de caoutchouc et de fils",4,0,{v:4}],["Usine (vessie + enveloppe)",11,4,{v:7}],["Équipementier (assemblage, design)",38,11,{v:27}],["Boutique près du Bernabéu",60,38,{v:22}]]),
N("Calcule :",[["Somme des VA (€)",60],["Somme des chiffres d'affaires (€)",113]]),
Q("Pourquoi mesure-t-on la richesse par la VA ?",["Pour éviter de compter plusieurs fois la même matière (doubles comptes)","Parce que le CA est secret","Pour inclure les salaires","Pour retirer la TVA"],0)],
cor:"VA = prix − CI : 4, 7, 27, 22. Somme = 60 € = prix final. Somme des CA = 113 € : le caoutchouc serait compté plusieurs fois. La plus grosse VA vient de la marque/design et de la distribution."},
{t:'rap',ti:"L'impôt d'un rappeur et de son ingé son",xp:80,ctx:"Barème simplifié (inventé) : 0 % jusqu'à 11 000 € ; 11 % de 11 000 à 28 000 € ; 30 % de 28 000 à 80 000 € ; 41 % au-delà. Un rappeur déclare 200 000 €, son ingé son 30 000 €.",
p:[N("Calcule :",[["Impôt de l'ingé son (€)",2470],["Taux moyen de l'ingé son (%)",8.23,0.1],["Impôt du rappeur (€)",66670],["Taux moyen du rappeur (%)",33.34,0.1]]),
Q("« L'ingé son passe dans la tranche à 30 %, donc il paie 30 % sur tout son revenu. » Vrai ?",["Vrai","Faux : 30 % ne s'applique qu'à la partie au-dessus de 28 000 €"],1),
Q("Cet impôt est…",["Proportionnel","Progressif","Dégressif","Forfaitaire"],1)],
cor:"Ingé son : 17 000 × 11 % + 2 000 × 30 % = 2 470 € (≈ 8,2 %). Rappeur : 1 870 + 52 000 × 30 % + 120 000 × 41 % = 66 670 € (≈ 33,3 %). Impôt progressif : redistribution verticale. Le taux supérieur ne touche que la partie qui dépasse le seuil."},
{t:'jeu',ti:"L'IA dans un studio",xp:70,ctx:"Un studio de 40 développeurs produisait 4 niveaux par mois. Avec des outils d'IA et de génération procédurale, il en produit 6 par mois avec 30 développeurs.",
p:[N("Calcule :",[["Productivité avant (niveaux par développeur)",0.1],["Productivité après",0.2],["Évolution de la productivité (%)",100]]),
Q("C'est une croissance…",["Extensive","Intensive"],1),
C("Classe chaque effet.",["Substitution capital/travail","Complémentarité"],[["L'IA remplace 10 postes de level designer",0],["De nouveaux métiers apparaissent pour piloter l'IA",1],["Les développeurs restants produisent plus avec l'outil",1]])],
cor:"0,1 → 0,2 niveau par développeur : +100 %. Croissance intensive (gains de productivité). Effets : substitution (postes supprimés) mais aussi complémentarité (nouveaux métiers, montée en qualification)."},
{t:'foot',b:1,ti:"PIB en valeur, PIB en volume",xp:50,ctx:"Pays fictif : PIB de 2 000 Md€ en N−1 et 2 080 Md€ en N (en valeur). Inflation : 2,5 %. Population : 50 millions.",
p:[G('bar',["N−1","N"],[["PIB en valeur (Md€)",[2000,2080]]],"Md€","PIB en valeur"),
N("Calcule :",[["Croissance en valeur (%)",4],["Croissance en volume, environ (%)",1.5,0.1],["PIB par habitant en N (€)",41600]]),
Q("Lequel n'est PAS pris en compte dans le PIB ?",["Le salaire d'un joueur pro","Le bénévole qui entraîne les jeunes du club","La vente d'un maillot","Les services d'un kiné"],1)],
cor:"Valeur : (2 080 − 2 000) ÷ 2 000 = 4 %. Volume ≈ 4 − 2,5 = 1,5 %. PIB/hab = 2 080 Md ÷ 50 M = 41 600 €. Le bénévolat n'entre pas dans le PIB."},
{t:'rap',b:1,ti:"Impôts et redistribution",xp:40,ctx:"Différents prélèvements et prestations.",
p:[C("Quel type d'impôt ?",["Progressif","Proportionnel","Dégressif"],[["L'impôt sur le revenu par tranches",0],["La CSG, même taux pour tous",1],["La TVA, qui pèse plus sur les bas revenus",2]]),
C("Quelle redistribution ?",["Verticale","Horizontale"],[["Le RSA versé aux plus modestes",0],["Les remboursements de soins des malades",1],["Les pensions versées aux retraités",1]])],
cor:"IR = progressif ; CSG = proportionnelle ; TVA = dégressive. Verticale = des riches vers les pauvres ; horizontale = des non-exposés vers ceux qui subissent un risque."}
];

M.eco3=[
{t:'jeu',ti:"Le budget d'Emma, apprentie",xp:70,ctx:"Emma, 19 ans, a un revenu disponible de 1 250 € par mois. Dépenses : loyer 450 €, alimentation 220 €, transport 75 €, Game Pass 15 €, Spotify 11 €, forfait 15 €, sorties et jeux 140 €, vêtements 90 €. Le reste est épargné.",
p:[N("Calcule :",[["Consommation (€)",1016],["Épargne (€)",234],["Propension moyenne à consommer (ex. 0,75)",0.81,0.01],["Propension moyenne à épargner",0.19,0.01],["Coefficient budgétaire des loisirs : Game Pass + Spotify + sorties (%)",16.34,0.2],["Si son revenu monte de 2 % et l'inflation de 4 %, son pouvoir d'achat évolue d'environ (%)",-1.96,0.1]])],
cor:"Consommation = 1 016 € ; épargne = 234 €. PMC ≈ 0,81 ; PME ≈ 0,19 (somme = 1). Loisirs = 166 € → 166 ÷ 1 016 ≈ 16,3 %. Pouvoir d'achat ≈ 2 − 4 = −2 % (exact ≈ −1,9 %)."},
{t:'rap',ti:"Les baskets du clip",xp:50,ctx:"Dans un clip, un rappeur porte une paire de baskets rare à 300 €. La semaine suivante, les recherches explosent. Quelques mois plus tard, des fans « fashion » l'abandonnent car « tout le monde l'a ».",
p:[C("Quel comportement ?",["Consommation ostentatoire","Imitation","Distinction"],[["Le rappeur affiche un bien cher pour montrer sa réussite",0],["Les fans achètent la même paire",1],["Certains l'abandonnent quand elle devient trop commune",2]]),
Q("Quel auteur a parlé de consommation ostentatoire ?",["Engel","Veblen","Schumpeter","Keynes"],1)],
cor:"Ostentatoire (Veblen) = montrer son statut ; imitation = consommer comme son groupe ; distinction = se démarquer. Les marques s'en servent (placements, éditions limitées)."},
{t:'foot',ti:"Épargner une carrière courte",xp:60,ctx:"Un gardien du FC Porto (cas fictif) gagne 900 000 € net par an. Sa carrière pro durera environ 12 ans. Il décide d'épargner 40 % de ses revenus.",
p:[N("Calcule (sans intérêts) :",[["Épargne annuelle (€)",360000],["Épargne totale sur 12 ans (€)",4320000]]),
Q("Quels motifs d'épargne le concernent ? (plusieurs réponses)",["Précaution (blessure, fin de carrière)","Retraite / après-carrière","Projet de reconversion","Payer la TVA"],[0,1,2]),
Q("Pour l'économie, l'épargne sert à…",["Financer l'investissement","Créer de l'inflation","Supprimer les impôts","Rien"],0)],
cor:"360 000 € par an ; 4 320 000 € sur 12 ans. Motifs : précaution, retraite, projet (et placement, transmission). L'épargne finance l'investissement via banques et marchés."},
{t:'foot',b:1,ti:"Le taux d'épargne en crise",xp:50,ctx:"Taux d'épargne des ménages d'un pays imaginaire (en % du revenu disponible).",
p:[G('line',["2018","2019","2020","2021","2022","2023"],[["Taux d'épargne (%)",[14.5,15,21,18.5,17,17.5]]],"%","Taux d'épargne des ménages"),
N("Lis le graphique :",[["Hausse 2019 → 2020 (points)",6],["Hausse 2019 → 2020 (%)",40],["Écart entre 2020 et 2023 (points)",-3.5]]),
Q("Comment expliquer le pic de 2020 (crise sanitaire) ?",["Épargne de précaution et consommation empêchée","Hausse des taux de la TVA","Baisse des revenus des riches","Fin du crédit"],0)],
cor:"Pic à 21 % en 2020 : +6 points, soit (21 − 15) ÷ 15 = +40 %. Entre 2020 et 2023 : −3,5 points. incertitude → épargne de précaution, et confinements qui empêchent de consommer. Puis retour progressif."},
{t:'rap',b:1,ti:"Les lois d'Engel",xp:50,ctx:"Ménage A : consommation totale 1 400 €, dont 375 € d'alimentation. Ménage B (plus aisé) : consommation 3 800 €, dont 700 € d'alimentation.",
p:[N("Calcule les coefficients budgétaires de l'alimentation :",[["Ménage A (%)",26.79,0.2],["Ménage B (%)",18.42,0.2]]),
Q("Que montre la comparaison ?",["Quand le revenu augmente, la part de l'alimentation baisse","Les riches mangent moins","Les deux ménages dépensent pareil","La part de l'alimentation augmente avec le revenu"],0)],
cor:"A : 375 ÷ 1 400 ≈ 26,8 %. B : 700 ÷ 3 800 ≈ 18,4 %. B dépense plus en euros mais une part plus faible : loi d'Engel."}
];

M.eco4=[

PC.sgn1={t:'edf',ti:"Le staff de l'équipe de France à Clairefontaine",dur:40,xp:150,
ctx:"Au Centre national du football de Clairefontaine, le staff qui prépare l'équipe de France (kinés, analystes vidéo, intendants, cuisiniers…) compte 15 salariés. Avant un grand tournoi, la direction veut mieux impliquer ce personnel. Situation et chiffres inventés pour l'entraînement.",
docs:[DX("Doc 1 · Témoignage de Malik, analyste vidéo recruté il y a 3 mois","<p>« J'ai un master en analyse de données sportives et je connais par cœur les logiciels de tracking. Chaque soir je découpe les matchs adverses en séquences de 20 secondes pour le staff. Je reste concentré même quand on me demande trois montages différents à minuit. Par contre, personne ne m'a jamais dit si mon travail servait vraiment : je ne suis jamais invité aux réunions tactiques, et je ne sais pas ce que deviennent mes vidéos. Le salaire est correct et les locaux sont magnifiques, mais je me demande si je vais rester. »</p>"),
DT("Doc 2 · Rémunération mensuelle d'un analyste vidéo",["Élément","Montant"],[["Salaire brut","2 800 €"],["Cotisations salariales","22 % du brut"],["Cotisations patronales","41 % du brut"],["Prime collective si qualification en demi-finale","500 € par salarié"]]),
DG("Doc 3 · Enquête interne : part du staff satisfait (en %)","bar",["Salaire","Conditions de travail","Sécurité de l'emploi","Reconnaissance","Autonomie"],[["Satisfaits (%)",[78,92,85,31,44]]],"%")],
p:[C("Doc 1. Classe chaque élément de la compétence de Malik.",["Savoir","Savoir-faire","Savoir-être"],[["Master en analyse de données sportives",0],["Découper un match en séquences de 20 secondes",1],["Rester concentré à minuit sous la pression",2],["Connaître le fonctionnement des logiciels de tracking",0]]),
N("Doc 2. Calcule pour un analyste vidéo :",[["Salaire net mensuel (€)",2184],["Coût du travail mensuel pour l'employeur (€)",3948],["Coût total de la prime collective pour les 15 salariés (€)",7500]]),
Q("Doc 3. Quel facteur est le moins satisfaisant pour le staff ?",["Le salaire","Les conditions de travail","La reconnaissance","La sécurité de l'emploi"],2),
C("Doc 3. Classe chaque élément selon Herzberg.",["Facteur d'hygiène","Facteur moteur"],[["Salaire",0],["Conditions de travail",0],["Sécurité de l'emploi",0],["Reconnaissance",1],["Autonomie",1]]),
R("Docs 1 à 3. Rédige une réponse argumentée : quels leviers la direction peut-elle utiliser pour transformer Malik en véritable acteur de l'équipe ?",[["Reconnaissance du travail / retours","reconnaissance|reconnaitre|feedback|retour"],["Communication (ascendante, réunions)","communication|reunion|ascendant|informer"],["Autonomie / responsabilités","autonomie|responsabilit"],["Facteurs moteurs de Herzberg","moteur|herzberg"],["Appui sur les documents (chiffres, témoignage)","31|44|doc"],["Rémunération / prime collective","prime|remuneration|salaire"]])],
cor:"1) Savoirs : master, connaissance des logiciels. Savoir-faire : découper les séquences. Savoir-être : concentration sous pression.\n2) Net = 2 800 − 616 = 2 184 €. Coût du travail = 2 800 + 1 148 = 3 948 €. Prime : 15 × 500 = 7 500 €.\n3) La reconnaissance (31 %).\n4) Hygiène : salaire, conditions, sécurité (bien notés : pas d'insatisfaction). Moteurs : reconnaissance, autonomie (mal notés : pas de motivation).\n5) Leviers : reconnaissance (retours sur son travail), communication ascendante et participation aux réunions tactiques, plus d'autonomie et de responsabilités, prime collective qui renforce la cohésion. Selon Herzberg, ce sont les facteurs moteurs qui manquent (31 % et 44 %) ; le salaire et les locaux sont déjà satisfaisants."};

PC.sgn3={t:'rap',ti:"Néon Records, label indépendant",dur:50,xp:150,
ctx:"Néon Records (label fictif) produit trois artistes de rap. Sa gérante prépare la tournée de l'an prochain et veut un diagnostic de la performance.",
docs:[DT("Doc 1 · Compte de résultat simplifié de l'année N (en k€)",["Élément","Montant"],[["Production vendue (streaming, vinyles, concerts)",900],["Consommations intermédiaires (studios, clips, pub)",360],["Charges de personnel",324],["Autres charges d'exploitation (amortissements…)",96],["Charges financières (intérêts)",15],["Produits exceptionnels (vente d'un catalogue)",20],["Impôt sur les bénéfices",31]]),
DX("Doc 2 · Projet de tournée","<p>Charges fixes de la tournée (salles, techniciens, transport) : <b>84 000 €</b>. Prix moyen d'un billet : <b>35 €</b>. Coût variable par spectateur (commission billetterie, sécurité, SACEM) : <b>14 €</b>. La gérante espère vendre 6 000 billets, régulièrement sur 12 mois de prévente.</p>"),
DG("Doc 3 · Chiffre d'affaires du label (k€)","bar",["N−2","N−1","N"],[["CA (k€)",[700,820,900]]],"k€")],
p:[N("Doc 1. Calcule (en k€ ou %) :",[["Valeur ajoutée (k€)",540],["Part de la VA revenant au personnel (%)",60],["Résultat d'exploitation (k€)",120],["Résultat net (k€)",94]]),
N("Doc 2. Pour la tournée, calcule :",[["MCV unitaire (€)",21],["Taux de MCV (%)",60],["Seuil de rentabilité (€)",140000],["Seuil en nombre de billets",4000],["Point mort avec 6 000 billets (en mois)",8]]),
N("Doc 3 et doc 1. Calcule :",[["Taux de variation du CA entre N−1 et N (%)",9.76,0.1],["Taux de profitabilité en N (%)",10.44,0.1]]),
Q("Au seuil de rentabilité, la tournée…",["Fait un bénéfice égal aux charges fixes","Ne fait ni bénéfice ni perte","Perd les charges fixes","Ne vend aucun billet"],1),
R("Rédige le diagnostic demandé par la gérante : le label est-il performant, et la tournée est-elle raisonnable ?",[["Croissance du CA (+9,8 %)","9[,.]?7|9[,.]?8|croissance|hausse|augment"],["Résultat positif / profitabilité","benefice|profitab|resultat|94|10[,.]4"],["Rôle du produit exceptionnel","exceptionnel|catalogue"],["SR 4 000 billets < 6 000 prévus","4 ?000|seuil"],["Marge de sécurité / risque de la tournée","marge de securite|risque|8 mois|point mort"]])],

N("Doc 1 et doc 2. Calcule :",[["Coût total du crédit sur 4 ans (€)",150000],["Stock d'alerte des écharpes",480],["Valeur acquise du placement après 3 ans (€)",212241.6,1]]),
